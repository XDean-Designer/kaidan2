<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:390px;height:844px;border:0}</style>
</head>
<body>
<iframe id="f" src="index.html?t=__TS__"></iframe>
<script>
var v = 'compact-add';
try { v = new URLSearchParams(location.search).get('v') || v; } catch (e) {}
var f = document.getElementById('f');
var w = null, d = null, phase = 'boot';
var rep = document.createElement('pre');
rep.id = 'rep';
rep.setAttribute('style', 'position:absolute;top:900px;left:0;font-size:10px;white-space:pre-wrap');
document.body.appendChild(rep);
function setRep() { rep.textContent = 'v=' + v + ' phase=' + phase; }
function waitFor(cond, cb, n) {
  n = (n == null) ? 300 : n;
  if (cond()) return cb();
  if (n <= 0) { phase = 'timeout'; setRep(); return; }
  setTimeout(function () { waitFor(cond, cb, n - 1); }, 100);
}
/* 1:1 出图：把 1.25× 的演示台与左侧导航关掉，截图就是真实的 390×844 逻辑画布 */
function oneToOne() {
  var st = d.createElement('style');
  st.textContent = '.site-nav{display:none!important}.stage{margin-left:0!important;padding:0!important}' +
    '#frame{transform:none!important;margin-bottom:0!important;box-shadow:none!important}';
  d.head.appendChild(st);
}
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  oneToOne();
  setRep();
  setTimeout(run, 500);
});
function run() {
  try { drive(); } catch (e) { phase = 'err:' + e.message; setRep(); }
}
function drive() {
  /* ≤5 人：添加 sheet 紧凑形态 */
  if (v === 'compact-add') {
    w.go('s1');
    waitFor(function () { return d.querySelector('#s1 .v2-cat-item .v2-add-btn'); }, function () {
      setTimeout(function () {
        d.querySelector('#s1 .v2-cat-item .v2-add-btn').click();
        phase = 'compact-add'; setRep();
      }, 400);
    });
    return;
  }
  /* ≤5 人：直接收款员工面板 */
  if (v === 'compact-quick') {
    w.go('s2');
    waitFor(function () { return d.getElementById('s2StaffRow'); }, function () {
      setTimeout(function () { w.toggleQuickStaff('s2'); phase = 'compact-quick'; setRep(); }, 400);
    });
    return;
  }
  /* ≤5 人：结算页「修改服务员工」sheet */
  if (v === 'compact-co') {
    w.go('s1');
    waitFor(function () { return d.querySelector('#s1 .v2-cat-item .v2-add-btn'); }, function () {
      setTimeout(function () {
        d.querySelector('#s1 .v2-cat-item .v2-add-btn').click();
        waitFor(function () { return d.querySelector('#addSheetMask .btn-confirm'); }, function () {
          setTimeout(function () {
            d.querySelector('#addSheetMask .btn-confirm').click();
            w.go('s6');
            waitFor(function () { return d.querySelector('#s6 .co-row.co-staff-row'); }, function () {
              setTimeout(function () {
                d.querySelector('#s6 .co-row.co-staff-row').click();
                phase = 'compact-co'; setRep();
              }, 420);
            });
          }, 300);
        });
      }, 400);
    });
    return;
  }
  /* >5 人（12 人演示池）：进入「选择大工」选择页 */
  if (v === 'pick12') {
    w.demoStaffPicker12();
    waitFor(function () { return d.querySelector('#asStaffGrid .sp-pick'); }, function () {
      setTimeout(function () { phase = 'pick12'; setRep(); }, 700);
    });
    return;
  }
  /* >5 人：落位后回到槽位行 */
  if (v === 'pick12-rows') {
    w.demoStaffPicker12();
    waitFor(function () { return d.querySelector('#asStaffGrid .sp-pick'); }, function () {
      setTimeout(function () {
        d.querySelectorAll('#asStaffGrid .sp-pick')[0].click();
        setTimeout(function () { phase = 'pick12-rows'; setRep(); }, 600);
      }, 500);
    });
    return;
  }
  /* s14 挂单列表（去结单） */
  if (v === 'hold') {
    w.openHoldList();
    waitFor(function () { return d.querySelector('#s14 .btn-take'); }, function () {
      setTimeout(function () { phase = 'hold'; setRep(); }, 600);
    });
    return;
  }
  phase = 'unknown-v:' + v; setRep();
}
</script>
</body></html>
