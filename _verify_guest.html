<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
function P(k, v) { log.push(k + ' = ' + v); }
var f = document.createElement('iframe');
f.src = 'index.html?capture=s6-items&bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return Array.prototype.slice.call(d.querySelectorAll(s)); }
function items() { return qa('#s6 .co-item'); }
function snap(tag) {
  P(tag + ' coCust', w.coCust);
  P(tag + ' __lastCoCust', w.__lastCoCust);
  P(tag + ' touched', w.__v2OrderCouponTouched);
  P(tag + ' orderCoupon', w.__v2OrderCoupon ? w.__v2OrderCoupon.name : 'null');
  P(tag + ' couponBase', w.couponBase());
  P(tag + ' orderPayableSum', w.orderPayableSum());
  P(tag + ' firstUsable', String(w.couponUsable(w.COUPONS[0], w.couponBase())));
  P(tag + ' 权益值', qa('#s6 .co-item .co-row[data-benefit] .val').map(function (e) { return e.textContent.replace(/\s+/g, ''); }).join(','));
  P(tag + ' 券行DOM', (q('#s6 [data-coupon-val]') || {}).innerText.replace(/\s+/g, ''));
  P(tag + ' 底栏', q('#coPay').textContent);
  P(tag + ' benefitAutoFlags', w.cartItems.map(function (it) { return String(!!it._benefitAuto) + '/' + String(!!it._benefitCleared); }).join(','));
}
var steps = [
  function (next) { snap('A 初始'); next(); },
  function (next) { w.setCoCust('guest'); w.renderCo(); snap('B 切散客'); next(); },
  function (next) { w.__v2OrderCouponTouched = false; w.renderCo(); snap('C 重置touched后重渲'); next(); },
  function (next) { w.autoFillCoupon(true); if (w.__v2RenderCouponRows) w.__v2RenderCouponRows(); snap('D 手动 autoFillCoupon'); next(); },
  function (next) { w.setCoCust('member'); w.renderCo(); snap('E 切会员'); next(); },
  function (next) { w.__v2OrderCouponTouched = false; w.setCoCust('guest'); w.renderCo(); snap('F 再切散客'); next(); }
];
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  var i = 0;
  function runNext() {
    if (i >= steps.length) {
      var pre = document.createElement('pre');
      pre.textContent = log.join('\n');
      document.body.appendChild(pre);
      return;
    }
    var fn = steps[i++];
    try { fn(function () { setTimeout(runNext, 120); }); }
    catch (e) { log.push('ERR step' + i + ': ' + e.message); setTimeout(runNext, 120); }
  }
  var t = 0, iv = setInterval(function () {
    t += 100;
    if ((items().length > 0 && getComputedStyle(d.getElementById('s6')).display !== 'none') || t > 20000) {
      clearInterval(iv);
      P('waitMs', t);
      try { runNext(); } catch (e) { log.push('ERR boot: ' + e.message); }
    }
  }, 100);
});
</script>
</body></html>
