<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(run, 500);
  function run() {
    w.setCust('guest');
    w.go('s1');
    setTimeout(function () {
      var body = d.getElementById('s1BillBody');
      var wrap = body.querySelector('[data-ccard-wrap]');
      var card = body.querySelector('.v2-ccard');
      log.push('body class=' + body.className);
      log.push('wrap style.height=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height));
      log.push('wrap children=' + wrap.children.length + ' -> ' + Array.prototype.map.call(wrap.children, function (c) { return c.className; }).join(' || '));
      log.push('card class=' + card.className);
      log.push('card display=' + getComputedStyle(card).display + ' height=' + getComputedStyle(card).height + ' rect=' + Math.round(card.getBoundingClientRect().height) + ' mt=' + getComputedStyle(card).marginTop);
      log.push('card parent=' + card.parentNode.className);
      /* 手动量测 */
      wrap.style.height = 'auto';
      log.push('after auto: wrap=' + Math.round(wrap.getBoundingClientRect().height) + ' card=' + Math.round(card.getBoundingClientRect().height));
      log.push('price-card margin-top=' + getComputedStyle(body.querySelector('.v2-price-card')).marginTop);
      var pre = document.createElement('pre');
      pre.textContent = log.join('\n');
      document.body.appendChild(pre);
    }, 400);
  }
});
</script>
</body></html>
