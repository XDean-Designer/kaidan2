<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(run, 500);
  function run() {
    w.setCust('guest');
    w.go('s1');
    setTimeout(function () {
      var body = d.getElementById('s1BillBody');
      var wraps = d.querySelectorAll('#s1 .v2-ccard-wrap');
      log.push('wrap 数量=' + wraps.length + ' -> ' + Array.prototype.map.call(wraps, function (x) {
        return (x.closest('.v2-legacy-hide') ? 'LEGACY:' : 'BODY:') + x.getAttribute('style') + '/' + Math.round(x.getBoundingClientRect().height);
      }).join(' | '));
      var navs = d.querySelectorAll('#s1 .nav-cust, #s1 [data-nav-cust]');
      log.push('nav-cust 命中=' + navs.length + ' -> ' + Array.prototype.map.call(navs, function (x) {
        return x.className + '[wired=' + x.getAttribute('data-wired') + ']';
      }).join(' | '));
      var nav = d.querySelector('#s1 .nav-cust');
      nav.click();
      var wrap = body.querySelector('[data-ccard-wrap]');
      log.push('click 后立刻: style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height) +
        ' body=' + body.className);
      setTimeout(function () {
        log.push('+80ms style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height));
        setTimeout(function () {
          log.push('+240ms style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height));
          setTimeout(function () {
            log.push('+480ms style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height));
            nav.click();
            log.push('再点立刻 rect=' + Math.round(wrap.getBoundingClientRect().height) + ' body=' + body.className);
            setTimeout(function () {
              log.push('再点+480ms style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height));
              var pre = document.createElement('pre');
              pre.textContent = log.join('\n');
              document.body.appendChild(pre);
            }, 480);
          }, 240);
        }, 160);
      }, 80);
    }, 400);
  }
});
</script>
</body></html>
