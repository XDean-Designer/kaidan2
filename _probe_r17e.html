<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = [];
function P() { log.push([].slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function raw(e) { var r = e.getBoundingClientRect();
  return { t: Math.round(r.top * 10) / 10, b: Math.round(r.bottom * 10) / 10, h: Math.round(r.height * 10) / 10, w: Math.round(r.width * 10) / 10 }; }
var steps = [];
function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { P('ERR ' + e.message); } setTimeout(next, 260); }
function finish() { var pre = document.createElement('pre'); pre.textContent = log.join('\n'); document.body.appendChild(pre); }
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);
  S(function () { w.go('s1'); });
  S(function () { q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });
  S(function () { w.go('s6'); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    var body = q('#s15 .suc-body');
    P('suc-body children = ' + body.children.length);
    [].slice.call(body.children).forEach(function (c, i) {
      P('  [' + i + '] ' + (c.tagName + '.' + c.className) + ' ' + JSON.stringify(raw(c)) +
        ' mt=' + getComputedStyle(c).marginTop + ' mb=' + getComputedStyle(c).marginBottom +
        ' pos=' + getComputedStyle(c).position);
    });
    P('body computed: padding=' + getComputedStyle(body).padding + ' gap=' + getComputedStyle(body).gap +
      ' justify=' + getComputedStyle(body).justifyContent + ' align=' + getComputedStyle(body).alignItems);
    P('card 前一个兄弟 display: ' + (q('#s15 .suc-card').previousElementSibling ?
      q('#s15 .suc-card').previousElementSibling.className + ' h=' + JSON.stringify(raw(q('#s15 .suc-card').previousElementSibling)) : 'none'));
    P('逻辑换算: body.t=' + ((raw(body).t - 24) / 1.25) + ' card.t=' + ((raw(q('#s15 .suc-card')).t - 24) / 1.25) +
      ' card.b=' + ((raw(q('#s15 .suc-card')).b - 24) / 1.25) + ' card.h=' + (raw(q('#s15 .suc-card')).h / 1.25));
  });
});
</script>
</body></html>
