<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:390px;height:844px;border:0}</style>
</head>
<body>
<iframe id="f" src="index.html?capture=shot&t=__TS__"></iframe>
<script>
var f = document.getElementById('f');
var w, d, phase = 'boot';
var out = [];
function P() { out.push(Array.prototype.slice.call(arguments).join(' ')); }
function waitFor(cond, cb, n) {
  n = (n == null) ? 300 : n;
  if (cond()) return cb(null);
  if (n <= 0) return cb(new Error('timeout'));
  setTimeout(function () { waitFor(cond, cb, n - 1); }, 50);
}
function goto(sid, cb, tries) {
  tries = (tries == null) ? 8 : tries;
  w.go(sid);
  setTimeout(function () {
    var el = d.getElementById(sid);
    if (el && getComputedStyle(el).display !== 'none') return cb ? cb(null) : null;
    if (tries <= 0) return cb ? cb(new Error('goto ' + sid)) : null;
    goto(sid, cb, tries - 1);
  }, 220);
}
function addN(n, cb) {
  var i = 0;
  (function step() {
    if (i >= n) return cb(null);
    var btns = d.querySelectorAll('#s1 .v2-cat-item .v2-add-btn');
    if (!btns.length) return cb(new Error('no add btn'));
    btns[Math.min(i, btns.length - 1)].click();
    waitFor(function () { var m = d.getElementById('addSheetMask'); return !!(m && m.classList.contains('show')); }, function (err) {
      if (err) return cb(err);
      d.querySelector('#addSheetMask .btn-confirm').click();
      i++;
      setTimeout(step, 420);
    });
  })();
}
function dump(tag) {
  P('--- ' + tag + ' visible=' + Array.prototype.filter.call(d.querySelectorAll('.screen'), function (s) {
    return getComputedStyle(s).display !== 'none'; }).map(function (s) { return s.id; }).join(','));
  [120, 250, 400, 500, 600, 700, 800].forEach(function (y) {
    var el = d.elementFromPoint(195, y);
    var desc = el ? (el.tagName + '.' + (el.className || '') + '#' + (el.id || '')) : 'null';
    P('  y' + y + ' → ' + String(desc).slice(0, 110));
  });
  P('  打开的浮层: ' + Array.prototype.filter.call(d.querySelectorAll('.addsheet-mask, .picker-mask, .date-pop, .more-menu, .mask'), function (m) {
    var st = getComputedStyle(m);
    return st.display !== 'none' && st.visibility !== 'hidden' && parseFloat(st.opacity) > 0.01;
  }).map(function (m) { return (m.id || m.className); }).join(' , '));
  P('  s15 opacity=' + getComputedStyle(d.getElementById('s15')).opacity +
    ' active=' + d.getElementById('s15').classList.contains('active'));
  var pre = document.createElement('pre');
  pre.textContent = out.join('\n');
  document.body.appendChild(pre);
}
(function poll() {
  try { w = f.contentWindow; d = w ? w.document : null; } catch (e) {}
  if (w && d && w.go && d.querySelector && d.querySelector('.screen') && typeof w.__v2SyncHold === 'function') {
    setTimeout(function () {
      w.setCust('guest'); w.setCoCust('guest');
      goto('s1', function () {
        waitFor(function () { return d.querySelectorAll('#s1 .v2-add-btn').length > 0; }, function () {
          setTimeout(function () {
            addN(2, function () {
              goto('s6', function () {
                setTimeout(function () {
                  d.querySelector('#s6 .co-bar .btn-c').click();
                  setTimeout(function () { dump('after-checkout'); }, 1200);
                }, 500);
              });
            });
          }, 500);
        });
      });
    }, 900);
    return;
  }
  setTimeout(poll, 80);
})();
</script>
</body></html>
