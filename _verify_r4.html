<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
/* R4 验收：1) 图标尺寸  2) 会员卡展开区持卡列表  3) sheet 删价格行  4) 成功页次要字段入卡 */
var log = [];
function P() { log.push(Array.prototype.slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return Array.prototype.slice.call(d.querySelectorAll(s)); }
function txt(s) { var e = q(s); return e ? e.textContent.replace(/\s+/g, '') : 'N/A'; }
function size(el) {
  if (!el) return 'N/A';
  var r = el.getBoundingClientRect();
  return Math.round(r.width) + 'x' + Math.round(r.height);
}
function inside(sel, root) { var e = q(sel); return !!(e && root && root.contains(e)); }

var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) return finish();
  var fn = steps.shift();
  try { fn(); } catch (e) { log.push('ERR ' + e.message); }
  setTimeout(next, 280);
}
function finish() {
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}

f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 400); }, 400);

  /* ===== 1. 图标尺寸 ===== */
  S(function () { w.setCust('guest'); w.go('s4'); w.toggleAddMember && w.toggleAddMember(); });
  S(function () {
    P('1 s4 添加会员 图标 =', size(q('#s4 .pick-add-av svg')), '外壳 =', size(q('#s4 .pick-add-av')));
    P('1 s4 行头其它头像 =', size(q('#s4 .pick-row .avatar')));
  });
  S(function () { if (w.setGuestGender) w.setGuestGender('male'); w.go('s1'); });
  S(function () { q('#s1 .nav-cust').click(); });
  S(function () {
    P('2 顾客卡 添加会员 图标 =', size(q('#s1 [data-ccard-wrap] .v2-ccard__addmem svg')),
      '按钮 =', size(q('#s1 [data-ccard-wrap] .v2-ccard__addmem')),
      '头像参照 =', size(q('#s1 [data-ccard-wrap] .v2-ccard__avatar')));
  });

  /* ===== 2. 会员卡展开区 ===== */
  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_female3.png',
      lastVisit: '2026-08-15', cards: '3', balance: '2049', discount: '8.0', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.setCust('member');
    w.go('s5');
  });
  S(function () {
    var card = q('#s5 [data-ccard-wrap] .v2-ccard--member');
    P('3 展开前 持卡列表 display =', card ? getComputedStyle(card.querySelector('.v2-ccard__cards')).display : 'N/A');
    P('3 旧三宫格 残留 =', qa('#s5 [data-ccard-wrap] .v2-ccard__metric, #s5 [data-ccard-wrap] .v2-ccard__metrics').length);
    q('#s5 [data-ccard-wrap] [data-ccard-toggle]').click();
  });
  S(function () {
    var card = q('#s5 [data-ccard-wrap] .v2-ccard--member');
    var box = card.querySelector('.v2-ccard__cards');
    var rows = qa('#s5 [data-ccard-wrap] .v2-ccard__mc');
    P('4 展开后 display =', getComputedStyle(box).display, '行数 =', rows.length);
    rows.forEach(function (r, i) {
      P('4 第' + (i + 1) + '行 =',
        '[' + r.querySelector('.v2-ccard__mc-type').textContent + ']',
        r.querySelector('.v2-ccard__mc-name').textContent,
        '|', r.querySelector('.v2-ccard__mc-rest').textContent,
        '| 行高 = ' + r.offsetHeight,
        '| 权益右缘距卡右 = ' + Math.round(card.getBoundingClientRect().right - r.querySelector('.v2-ccard__mc-rest').getBoundingClientRect().right) + 'px');
    });
    P('4 展开卡高 =', q('#s5 [data-ccard-wrap] .v2-ccard').offsetHeight);
  });
  /* 结算页淡色会员卡同样生效 */
  S(function () { w.go('s6'); });
  S(function () {
    var card = q('#s6 .v2-ccard--member');
    if (!card) { P('5 s6 会员卡 = N/A'); return; }
    P('5 s6 淡色卡 持卡行数 =', card.querySelectorAll('.v2-ccard__mc').length,
      '首行 =', txt('#s6 .v2-ccard__mc-rest'));
  });
  /* 新注册会员 → 空态 */
  S(function () {
    w.setCust('member');
    w.__v2Member = { name: '赵小姐', gender: 'female', avatar: 'assets/avatar_card_female.png',
      lastVisit: '2026-09-18', cards: '0', balance: '0', discount: '—', isNew: true };
    w.__v2MemberNoBenefit = true;
    w.go('s5');
  });
  S(function () {
    q('#s5 .nav-cust').click();
    setTimeout(function () {
      P('6 新会员 空态 =', q('#s5 [data-ccard-wrap] .v2-ccard__cards.is-empty')
        ? txt('#s5 [data-ccard-wrap] .v2-ccard__cards.is-empty') : 'MISS',
        '持卡行数 =', qa('#s5 [data-ccard-wrap] .v2-ccard__mc').length);
      w.__v2MemberNoBenefit = false;
    }, 200);
  });

  /* ===== 3. sheet 删价格行 ===== */
  S(function () { w.setCust('guest'); w.go('s1'); });
  S(function () { q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () {
    P('7 sheet 价格行 元素 =', q('#addSheetMask #asPrice') ? 'STILL THERE' : 'GONE');
    P('7 sheet 标题 =', txt('#addSheetMask #asTitle'), '数量 =', txt('#addSheetMask #asQty'),
      '应付 =', (q('#addSheetMask #asPayable') || {}).value);
    P('7 sheet 头区子元素 =', qa('#addSheetMask .addsheet__head > *').map(function (e) { return e.className; }).join(' + '));
    q('#addSheetMask .addsheet__foot .btn-confirm').click();
  });
  S(function () { P('8 入车 =', w.cartItems.length, '角标 =', txt('#s1 [data-cart-badge]')); });

  /* ===== 4. 成功页 ===== */
  S(function () { q('[data-next="s1"]').click(); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    var card = q('#s15 #sucCard');
    P('9 成功页 =', qa('.screen').filter(function (s) { return getComputedStyle(s).display !== 'none'; }).map(function (s) { return s.id; }).join(','));
    P('9 卡外 meta 行 =', q('#s15 .suc-meta') ? 'STILL THERE' : 'GONE');
    P('9 日期/单号 在卡内 =', inside('#s15 #sucDate', card) + '/' + inside('#s15 #sucNo', card));
    P('9 日期/单号 =', txt('#s15 #sucDate'), txt('#s15 #sucNo'));
    P('9 卡高 =', Math.round(card.getBoundingClientRect().height),
      '次要行 =', Math.round(q('#s15 .suc-submeta').getBoundingClientRect().top - card.getBoundingClientRect().top) + 'px',
      '分隔线 =', Math.round(q('#s15 .suc-line2').getBoundingClientRect().top - card.getBoundingClientRect().top) + 'px');
    P('9 卡底余量 =', Math.round(card.getBoundingClientRect().bottom - q('#s15 .suc-submeta').getBoundingClientRect().bottom) + 'px');
    P('9 返回首页按钮 =', size(q('#s15 .ico-home')), '图标 =', size(q('#s15 .ico-home img')));
    P('9 剩余行 =', getComputedStyle(q('#s15 #sucRestRow')).display, 'no-rest 类 =', card.classList.contains('no-rest'));
  });
  /* 改单号 / 改日期 → 卡内字段同步 */
  S(function () { q('#s15 [data-suc-act="no"]').click(); });
  S(function () {
    q('#sucNoInput').value = '88899900';
    q('#sucNoOk').click();
    setTimeout(function () { P('10 改单号后 卡内单号 =', txt('#s15 #sucNo')); }, 120);
  });
  S(function () { q('#s15 [data-suc-act="date"]').click(); });
  S(function () {
    var days = qa('[data-date-pop] [data-date]').filter(function (x) {
      return !x.classList.contains('is-disabled') && !x.classList.contains('is-off');
    });
    days[0].click();
  });
  S(function () { P('11 改日期后 卡内日期 =', txt('#s15 #sucDate')); });
  /* 会员卡支付（有剩余行）→ 卡高回到 236 */
  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_female3.png',
      lastVisit: '2026-08-15', cards: '3', balance: '2049', discount: '8.0', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.setCust('member'); w.go('s5');
  });
  S(function () { q('#s5 .v2-cat-item .v2-add-btn').click(); });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });
  S(function () { q('[data-next="s5"]').click(); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    var card = q('#s15 #sucCard');
    P('12 会员支付 剩余行 =', getComputedStyle(q('#s15 #sucRestRow')).display, 'no-rest =', card.classList.contains('no-rest'),
      '卡高 =', Math.round(card.getBoundingClientRect().height), '支付方式 =', txt('#s15 #sucPayName'));
  });
});
</script>
</body></html>
