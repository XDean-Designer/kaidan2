<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
function P() { log.push(Array.prototype.slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function sz(el) { return el ? Math.round(el.getBoundingClientRect().width) + 'x' + Math.round(el.getBoundingClientRect().height) : 'MISS'; }
var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) {
    var pre = document.createElement('pre');
    pre.textContent = log.join('\n');
    document.body.appendChild(pre);
    return;
  }
  var fn = steps.shift();
  try { fn(); } catch (e) { log.push('ERR ' + e.message); }
  setTimeout(next, 300);
}
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 400); }, 400);

  /* 男散客 → 卡内「添加会员」图标 */
  S(function () { w.setCust('guest'); if (w.setGuestGender) w.setGuestGender('male'); w.go('s1'); });
  S(function () { q('#s1 .nav-cust').click(); });
  S(function () {
    P('wrap 内 guest 卡 data-g =', (q('#s1 [data-ccard-wrap] .v2-ccard') || {}).getAttribute
      ? q('#s1 [data-ccard-wrap] .v2-ccard').getAttribute('data-g') : 'MISS');
    P('卡内 添加会员 按钮 =', sz(q('#s1 [data-ccard-wrap] .v2-ccard__addmem')));
    P('卡内 添加会员 svg =', sz(q('#s1 [data-ccard-wrap] .v2-ccard__addmem svg')),
      'css =', q('#s1 [data-ccard-wrap] .v2-ccard__addmem svg') ? getComputedStyle(q('#s1 [data-ccard-wrap] .v2-ccard__addmem svg')).width : '-');
    /* 同卡内头像 44 作参照 */
    P('卡内 头像 参照 =', sz(q('#s1 [data-ccard-wrap] .v2-ccard__avatar')));
    q('#s1 [data-ccard-wrap] .v2-ccard__addmem').click();
  });
  S(function () {
    P('点图标后 注册面板 =', q('#s1 [data-ccard-wrap] [data-addmem-panel]')
      ? getComputedStyle(q('#s1 [data-ccard-wrap] [data-addmem-panel]')).display : 'MISS');
  });

  /* 新注册会员（无卡）→ 展开区空态 */
  S(function () {
    w.setCust('member');
    w.__v2Member = { name: '赵小姐', gender: 'female', avatar: 'assets/avatar_card_female.png',
      lastVisit: '2026-09-18', cards: '0', balance: '0', discount: '—', isNew: true };
    w.__v2MemberNoBenefit = true;
    w.go('s5');
  });
  S(function () { q('#s5 .nav-cust').click(); });
  S(function () {
    var box = q('#s5 [data-ccard-wrap] .v2-ccard__cards');
    P('新会员 空态 =', box ? box.className : 'MISS', '文案 =', box ? box.textContent.replace(/\s+/g, '') : '-',
      '行数 =', d.querySelectorAll('#s5 [data-ccard-wrap] .v2-ccard__mc').length);
    P('新会员 展开卡高 =', sz(q('#s5 [data-ccard-wrap]')));
  });

  /* 老会员（有卡）→ 行数 + 卡高 */
  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_female3.png',
      lastVisit: '2026-08-15', cards: '3', balance: '2049', discount: '8.0', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.go('s5');
  });
  S(function () { q('#s5 .nav-cust').click(); });
  S(function () {
    P('老会员 展开卡高 =', sz(q('#s5 [data-ccard-wrap]')),
      '持卡行数 =', d.querySelectorAll('#s5 [data-ccard-wrap] .v2-ccard__mc').length);
    var card = q('#s5 [data-ccard-wrap] .v2-ccard');
    Array.prototype.forEach.call(d.querySelectorAll('#s5 [data-ccard-wrap] .v2-ccard__mc'), function (r, i) {
      P('  行' + (i + 1) + ' =', r.querySelector('.v2-ccard__mc-type').textContent,
        '|', r.querySelector('.v2-ccard__mc-name').textContent,
        '|', r.querySelector('.v2-ccard__mc-rest').textContent,
        '| 行高', Math.round(r.getBoundingClientRect().height),
        '| 权益右缘距卡右', Math.round(card.getBoundingClientRect().right - r.querySelector('.v2-ccard__mc-rest').getBoundingClientRect().right));
    });
  });
});
</script>
</body></html>
