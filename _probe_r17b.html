<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = []; function P() { log.push([].slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function R(s) { var e = typeof s === 'string' ? q(s) : s; if (!e) return null; var r = e.getBoundingClientRect();
  var k = 1 / (w.__stageScale || 1.25), o = (w.__stageOffsetX || 0);
  function f1(v) { return Math.round((v - o) * k * 10) / 10; }
  return { l: f1(r.left), r: f1(r.right), w: Math.round(r.width * k * 10) / 10, h: Math.round(r.height * k * 10) / 10 }; }
var steps = []; function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { log.push('ERR ' + e.message); } setTimeout(next, 260); }
function finish() { var pre = document.createElement('pre'); pre.textContent = log.join('\n'); document.body.appendChild(pre); }

f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);

  S(function () { w.setCust('guest'); w.setCoCust('guest'); w.go('s1'); });
  S(function () { q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });
  S(function () { w.go('s6'); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    P('suc-acts      ' + JSON.stringify(R('#s15 .suc-acts')));
    P('suc-card      ' + JSON.stringify(R('#s15 .suc-card')));
    P('格宽 = ' + qa('#s15 .suc-act').map(function (e) { return Math.round(R(e).w); }).join('/'));
    P('格内文字宽 = ' + qa('#s15 .suc-act').map(function (e) { return e.textContent.replace(/\s+/g, ''); }).join('/'));
    var sp = q('#s15 .suc-print');
    P('打印小票 元素 = ' + (sp ? JSON.stringify(R(sp)) : 'none') + ' title=' + (sp ? sp.getAttribute('title') : '-'));
    P('suc-amt       ' + JSON.stringify(R('#s15 .suc-amt')));
    P('底栏          ' + JSON.stringify(R('#s15 .suc-bar')));
    var t = q('#s15 .suc-act'), r = R(t);
    P('单格可用宽 ' + r.w + ' − 4 字×12px = ' + (r.w - 48) + 'px 余量');
  });
});
</script>
</body></html>
