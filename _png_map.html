<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<pre id="rep">pending</pre>
<script>
/* 输出缩略色块图，便于在没有读图能力时肉眼判断布局 */
var files = (new URLSearchParams(location.search).get('f') || '').split(',').filter(Boolean);
var COLS = 26, ROWS = 24;
var out = []; var i = 0;
function step() {
  if (i >= files.length) return;
  var f = files[i++];
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var cw = Math.floor(c.width / COLS), ch = Math.floor(c.height / ROWS);
    out.push('=== ' + f + ' ' + c.width + 'x' + c.height + '  (每格 ' + cw + 'x' + ch + 'px)');
    for (var ry = 0; ry < ROWS; ry++) {
      var line = '';
      for (var rx = 0; rx < COLS; rx++) {
        var sr = 0, sg = 0, sb = 0, n = 0;
        for (var y = ry * ch; y < (ry + 1) * ch; y += 3) {
          for (var x = rx * cw; x < (rx + 1) * cw; x += 3) {
            var p = (y * c.width + x) * 4;
            sr += d[p]; sg += d[p + 1]; sb += d[p + 2]; n++;
          }
        }
        var r = Math.round(sr / n), gg = Math.round(sg / n), b = Math.round(sb / n);
        var lum = (r * 299 + gg * 587 + b * 114) / 1000;
        var chr = ' .:-=+*#%@'[Math.min(9, Math.max(0, Math.round((255 - lum) / 26)))];
        if (r > 180 && gg < 110 && b < 110) chr = 'R';
        if (lum > 250) chr = ' ';
        line += chr;
      }
      out.push(String(ry * ch).padStart(5) + ' |' + line + '|');
    }
    document.getElementById('rep').textContent = out.join('\n');
    step();
  };
  img.onerror = function () { out.push(f + ' LOAD-FAIL'); document.getElementById('rep').textContent = out.join('\n'); step(); };
  img.src = f;
}
step();
</script>
</body></html>
