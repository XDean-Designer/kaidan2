<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(run, 500);
  function run() {
    w.setCust('guest');
    w.go('s1');
    setTimeout(function () {
      var body = d.getElementById('s1BillBody');
      var wrap = body.querySelector('[data-ccard-wrap]');
      var card = body.querySelector('.v2-ccard');
      function L(t) { log.push(t + ': wrap.style=' + wrap.getAttribute('style') + ' rect=' + Math.round(wrap.getBoundingClientRect().height)); }
      L('init');
      var from = wrap.getBoundingClientRect().height;
      wrap.style.height = 'auto';
      var to = wrap.getBoundingClientRect().height;
      log.push('from=' + from + ' to=' + to);
      L('after auto');
      /* 把 0.38s 过渡去掉再试一次（判断是否过渡导致 auto 量测为 0） */
      wrap.style.transition = 'none';
      wrap.style.height = '0px';
      void wrap.offsetWidth;
      wrap.style.height = 'auto';
      log.push('no-transition to=' + Math.round(wrap.getBoundingClientRect().height));
      wrap.style.transition = '';
      wrap.style.height = '0px';
      void wrap.offsetWidth;
      /* 模拟点击路径 */
      var f2 = wrap.getBoundingClientRect().height;
      body.classList.add('cust-open');
      wrap.style.height = 'auto';
      var t2 = wrap.getBoundingClientRect().height;
      log.push('path2 from=' + f2 + ' to=' + t2);
      wrap.style.height = f2 + 'px';
      void wrap.offsetWidth;
      wrap.style.height = t2 + 'px';
      log.push('after set to: style=' + wrap.getAttribute('style'));
      setTimeout(function () {
        L('+60ms');
        setTimeout(function () {
          L('+200ms');
          var pre = document.createElement('pre');
          pre.textContent = log.join('\n');
          document.body.appendChild(pre);
        }, 140);
      }, 60);
    }, 400);
  }
});
</script>
</body></html>
