<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<pre id="rep">pending</pre>
<script>
var files = (new URLSearchParams(location.search).get('f') || '').split(',').filter(Boolean);
var out = []; var i = 0;
document.getElementById('rep').id = 'rep';
function step() {
  if (i >= files.length) return;
  var f = files[i++];
  var img = new Image();
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    var g = c.getContext('2d'); g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, c.width, c.height).data;
    var bands = 8, bh = Math.floor(c.height / bands);
    var lines = [f];
    for (var b = 0; b < bands; b++) {
      var n = 0, dark = 0, red = 0, sr = 0, sg = 0, sb = 0;
      for (var y = b * bh; y < (b + 1) * bh; y += 2) {
        for (var x = 0; x < c.width; x += 2) {
          var p = (y * c.width + x) * 4;
          var r = d[p], gg = d[p + 1], bb = d[p + 2];
          n++; sr += r; sg += gg; sb += bb;
          if (r + gg + bb < 240) dark++;
          if (r > 180 && gg < 110 && bb < 110) red++;
        }
      }
      lines.push('  y' + (b * bh) + '-' + ((b + 1) * bh) + ' 均=' +
        Math.round(sr / n) + ',' + Math.round(sg / n) + ',' + Math.round(sb / n) +
        ' 暗=' + dark + ' 红=' + red);
    }
    out.push(lines.join('\n'));
    document.getElementById('rep').textContent = out.join('\n');
    step();
  };
  img.onerror = function () { out.push(f + ' LOAD-FAIL'); document.getElementById('rep').textContent = out.join('\n'); step(); };
  img.src = f;
}
step();
</script>
</body></html>
