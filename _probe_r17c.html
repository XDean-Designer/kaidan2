<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = []; function P() { log.push([].slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function R(s) { var e = typeof s === 'string' ? q(s) : s; if (!e) return null; var r = e.getBoundingClientRect();
  var k = 1 / 1.25; function f1(v) { return Math.round(v * k * 10) / 10; }
  return { l: f1(r.left), r: f1(r.right), w: f1(r.width), h: f1(r.height) }; }
var steps = []; function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { log.push('ERR ' + e.message); } setTimeout(next, 260); }
function finish() { var pre = document.createElement('pre'); pre.textContent = log.join('\n'); document.body.appendChild(pre); }
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);
  S(function () { w.go('s4'); });
  S(function () {
    var wrap = q('#s4 .pick-row-wrap'), act = q('#s4 .pick-row-actions'), idx = q('#s4 .index-bar'), list = q('#s4 .pick-list');
    P('pick-list      ' + JSON.stringify(R(list)));
    P('wrap           ' + JSON.stringify(R(wrap)));
    P('actions        ' + JSON.stringify(R(act)));
    P('index-bar      ' + JSON.stringify(R(idx)));
    P('索引条首字母    ' + JSON.stringify(R('#s4 .index-bar span')));
    P('滚动区         ' + JSON.stringify(R('#s4 .pick-scroll') || R('#s4 .pick-list')));
    var a = R(act), i = R(idx);
    P('胶囊右缘 ' + a.r + '  索引条左缘 ' + i.l + '  ==> 重叠 ' + Math.round(Math.max(0, Math.min(a.r, i.r) - Math.max(a.l, i.l))) + 'px');
    P('胶囊 相对画布右缘的间距 = ' + Math.round(390 - a.r) + 'px（画布 390）');
    P('索引条 相对画布右缘 = ' + Math.round(390 - i.r) + 'px, 宽 ' + i.w);
    P('行内距右(padding-right) = ' + getComputedStyle(wrap).paddingRight + '  pick-list padding-right = ' + getComputedStyle(list).paddingRight);
    P('列表是否可滚 = ' + (list.scrollHeight > list.clientHeight) + '  scrollH=' + list.scrollHeight + ' clientH=' + list.clientHeight + ' clientW=' + list.clientWidth + ' scrollW=' + list.scrollWidth);
  });
});
</script>
</body></html>
