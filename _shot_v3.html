<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;width:390px;height:844px;border:0}</style>
</head>
<body>
<iframe id="f" src="index.html?capture=shot&t=__TS__"></iframe>
<script>
var v = 's1-closed';
try { v = new URLSearchParams(location.search).get('v') || v; } catch (e) {}
var f = document.getElementById('f');
var w = null, d = null, phase = 'boot';
/* 状态回报（写在视口之外，不影响截图；供 --dump-dom 校验驱动是否到位） */
var rep = document.createElement('pre');
rep.id = 'rep';
rep.setAttribute('style', 'position:absolute;top:900px;left:0;font-size:10px');
document.body.appendChild(rep);
function screenOf() {
  try {
    return Array.prototype.filter.call(d.querySelectorAll('.screen'), function (s) {
      return getComputedStyle(s).display !== 'none';
    }).map(function (s) { return s.id; }).join(',');
  } catch (e) { return '-'; }
}
function report() {
  try {
    var sucEl = d.getElementById('sucAmt');
    var billBody = d.getElementById('s1BillBody');
    var body5 = d.getElementById('s5BillBody');
    rep.textContent = 'view=' + v + ' phase=' + phase + ' visible=' + screenOf() +
      ' cart=' + (w && w.cartItems ? w.cartItems.length : '-') +
      ' sheet=' + (d.getElementById('addSheetMask') && d.getElementById('addSheetMask').classList.contains('show') ? 'open' : 'closed') +
      ' custOpen(s1/s5)=' + (billBody && billBody.classList.contains('cust-open') ? 'y' : 'n') + '/' +
      (body5 && body5.classList.contains('cust-open') ? 'y' : 'n') +
      ' navCust(s1/s5)=' + (d.querySelector('#s1 .nav-cust') ? d.querySelector('#s1 .nav-cust').textContent.replace(/\s+/g, '') : '-') + '/' +
      (d.querySelector('#s5 .nav-cust') ? d.querySelector('#s5 .nav-cust').textContent.replace(/\s+/g, '') : '-') +
      ' 成功页=' + (sucEl ? sucEl.textContent + '/' + (d.getElementById('sucPayName') || {}).textContent + '/' +
        (d.getElementById('sucDate') || {}).textContent + '/' + (d.getElementById('sucNo') || {}).textContent : '-');
  } catch (e) { rep.textContent = 'view=' + v + ' phase=' + phase + ' (pending) ' + e.message; }
}
function waitFor(cond, cb, n) {
  n = (n == null) ? 300 : n;
  if (cond()) return cb(null);
  if (n <= 0) return cb(new Error('timeout'));
  setTimeout(function () { waitFor(cond, cb, n - 1); }, 50);
}
/* 跳页并确认生效（避开原型自身的载入时导航竞态） */
function goto(sid, cb, tries) {
  tries = (tries == null) ? 8 : tries;
  w.go(sid);
  setTimeout(function () {
    var el = d.getElementById(sid);
    if (el && getComputedStyle(el).display !== 'none') return cb ? cb(null) : null;
    if (tries <= 0) return cb ? cb(new Error('goto ' + sid + ' 失败')) : null;
    goto(sid, cb, tries - 1);
  }, 220);
}
function addN(n, cb) {
  var i = 0;
  (function step() {
    if (i >= n) return cb(null);
    var btns = d.querySelectorAll('#s1 .v2-cat-item .v2-add-btn');
    if (!btns.length) return cb(new Error('no add btn'));
    btns[Math.min(i, btns.length - 1)].click();
    waitFor(function () {
      var m = d.getElementById('addSheetMask');
      return !!(m && m.classList.contains('show'));
    }, function (err) {
      if (err) return cb(err);
      d.querySelector('#addSheetMask .btn-confirm').click();
      i++;
      setTimeout(step, 420);
    });
  })();
}
function toSettle(cb) {
  phase = 'settle';
  w.setCust('guest'); w.setCoCust('guest');
  goto('s1', function (err) {
    if (err) { phase = 'gotoErr'; return; }
    waitFor(function () { return d.querySelectorAll('#s1 .v2-add-btn').length > 0; }, function () {
      setTimeout(function () {
        addN(2, function (e2) {
          if (e2) { phase = 'addErr:' + e2.message; return; }
          goto('s6', function (e3) {
            if (e3) { phase = 'gotoS6Err'; return; }
            waitFor(function () { return d.querySelectorAll('#s6 .co-item').length > 0; }, function () {
              phase = 's6';
              setTimeout(cb, 400);
            });
          });
        });
      }, 500);
    });
  });
}
function setMember() {
  w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_card_female.png',
    lastVisit: '2026-09-01', cards: '10', balance: '2049', discount: '8', isNew: false };
  w.__v2MemberNoBenefit = false;
}
function start() {
  phase = 'run';
  /* 截图时保留 toast（说明交互反馈）：capture 模式下 #toast 默认被隐藏 */
  d.documentElement.insertAdjacentHTML('beforeend',
    '<style>html.capture-figma #toast{display:block !important}</style>');
  if (v === 's0') { goto('s0'); phase = 's0'; return; }
  if (v === 's4') { goto('s4'); phase = 's4'; return; }
  if (v === 's14') { w.openHoldList(); phase = 's14'; return; }
  if (v === 's1-closed') { w.setCust('guest'); goto('s1'); phase = 's1'; return; }
  if (v === 's1-open') {
    w.setCust('guest');
    goto('s1', function () {
      setTimeout(function () { d.querySelector('#s1 .nav-cust').click(); phase = 'opened'; }, 500);
    });
    return;
  }
  if (v === 's5-member' || v === 's5-open' || v === 's5-cardlist') {
    setMember(); w.setCust('member');
    goto('s5', function () {
      phase = 's5';
      if (v === 's5-open') setTimeout(function () { d.querySelector('#s5 .nav-cust').click(); phase = 's5opened'; }, 500);
      if (v === 's5-cardlist') {
        setTimeout(function () {
          d.querySelector('#s5 .nav-cust').click();
          phase = 's5opened';
          setTimeout(function () {
            var chev = d.querySelector('#s5 [data-ccard-wrap] .v2-ccard__chev');
            if (chev) chev.click();
            phase = 's5cardlist';
          }, 620);
        }, 500);
      }
    });
    return;
  }
  if (v === 'sheet') {
    w.setCust('guest');
    goto('s1', function () {
      phase = 's1';
      setTimeout(function () { d.querySelector('#s1 .v2-add-btn').click(); phase = 'sheet'; }, 500);
    });
    return;
  }
  /* R16：添加 sheet 内员工槽位行 → 点 ＋ 进入员工卡片选择页 */
  if (v === 'staff') {
    w.setCust('guest');
    goto('s1', function () {
      phase = 's1';
      setTimeout(function () {
        d.querySelector('#s1 .v2-add-btn').click();
        phase = 'sheet';
        waitFor(function () { return d.querySelector('#asStaffGrid .sp-slot--add'); }, function () {
          setTimeout(function () {
            d.querySelector('#asStaffGrid .sp-row .sp-slot--add').click();
            phase = 'staff-pick';
          }, 520);
        });
      }, 500);
    });
    return;
  }
  /* R16：s6 明细「应付」行 → 数字键盘 sheet */
  if (v === 'co-price') {
    toSettle(function () {
      waitFor(function () { return d.querySelector('#s6 .co-item [data-price-edit]'); }, function () {
        setTimeout(function () {
          d.querySelector('#s6 .co-item [data-price-edit]').click();
          phase = 'co-price';
        }, 400);
      });
    });
    return;
  }
  /* R16：s6 明细「服务员工」行 → 修改服务员工 sheet（槽位行） */
  if (v === 'co-staff') {
    toSettle(function () {
      waitFor(function () { return d.querySelector('#s6 .co-item [data-staff-edit]'); }, function () {
        setTimeout(function () {
          d.querySelector('#s6 .co-item [data-staff-edit]').click();
          phase = 'co-staff';
        }, 400);
      });
    });
    return;
  }
  /* R16：s6 明细「服务员工」sheet → 点 ＋ 进入员工卡片选择页 */
  if (v === 'co-staff-pick') {
    toSettle(function () {
      waitFor(function () { return d.querySelector('#s6 .co-item [data-staff-edit]'); }, function () {
        setTimeout(function () {
          d.querySelector('#s6 .co-item [data-staff-edit]').click();
          waitFor(function () { return d.querySelector('#coStaffGrid .sp-slot--add'); }, function () {
            setTimeout(function () {
              d.querySelector('#coStaffGrid .sp-row .sp-slot--add').click();
              phase = 'co-staff-pick';
            }, 520);
          });
        }, 400);
      });
    });
    return;
  }
  if (v === 's7') {
    setMember(); w.setCust('member'); w.setQcoCust('member');
    goto('s1', function () {
      phase = 's1';
      setTimeout(function () { w.goQuickCheckout(); phase = 's7'; }, 500);
    });
    return;
  }
  if (v === 's6') { toSettle(function () {}); return; }
  if (v === 's15') {
    toSettle(function () {
      d.querySelector('#s6 .co-bar .btn-c').click();
      phase = 's15';
      /* R20：金额已不再入场计数（直接落终值），只需关掉入场动效即可截图 */
      setTimeout(function () {
        try {
          var el = d.getElementById('sucAmt');
          var target = (w.sucInfo && w.sucInfo.amount) ? String(w.sucInfo.amount) : el.textContent;
          if (el) el.textContent = target;
          d.querySelectorAll('#s15 .suc-head img, #s15 .suc-head .t, #s15 .suc-card, #s15 .suc-acts, #s15 .suc-bar')
            .forEach(function (e) { e.style.animation = 'none'; e.style.opacity = '1'; e.style.transform = 'none'; });
          phase = 's15-settled';
        } catch (e) { phase = 's15-settleErr:' + e.message; }
      }, 900);
    });
    return;
  }
  /* 挂单成功 toast → 跳到挂单列表（保持 toast 常显便于截图） */
  if (v === 'hold-toast') {
    w.setCust('guest');
    goto('s1', function () {
      waitFor(function () { return d.querySelectorAll('#s1 .v2-add-btn').length > 0; }, function () {
        setTimeout(function () {
          addN(1, function () {
            d.querySelector('#s1 [data-guadan="s1"]').click();
            phase = 'hold';
            setInterval(function () {
              var t = d.getElementById('toast');
              if (t && t.textContent) t.style.display = 'block';
            }, 80);
          });
        }, 400);
      });
    });
    return;
  }
  /* 商品「设置内容」sheet 点确定 → 加入购物车（保持 toast 常显） */
  if (v === 'add-toast') {
    w.setCust('guest');
    goto('s1', function () {
      waitFor(function () { return d.querySelectorAll('#s1 .v2-add-btn').length > 0; }, function () {
        setTimeout(function () { d.querySelector('#s1 .v2-add-btn').click(); phase = 'sheet'; }, 400);
      });
    });
    return;
  }
}
setInterval(report, 120);
var started = false;
(function poll() {
  try {
    w = f.contentWindow;
    d = w ? w.document : null;
  } catch (e) { phase = 'pollErr:' + e.message; }
  if (!started && w && d && w.go && d.querySelector && d.querySelector('.screen') &&
      typeof w.__v2SyncHold === 'function') {
    started = true;
    setTimeout(start, 800);   /* 等原型自身载入时导航跑完 */
    return;
  }
  setTimeout(poll, 80);
})();
</script>
</body></html>
