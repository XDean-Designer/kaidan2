<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
function P() { log.push(Array.prototype.slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function layout(el, prop) { return el ? el['offset' + prop] : 0; }
function geo(tag, sid) {
  var body = d.getElementById(sid + 'BillBody');
  var wrap = body.querySelector('[data-ccard-wrap]');
  var card = wrap.querySelector('.v2-ccard');
  var box = wrap.querySelector('.v2-ccard__cards');
  var rows = Array.prototype.slice.call(wrap.querySelectorAll('.v2-ccard__mc'));
  var prev = wrap.style.transition;
  wrap.style.transition = 'none';
  void wrap.offsetWidth;
  P(tag, 'wrap高=' + wrap.offsetHeight, 'card高=' + card.offsetHeight,
    'cards display=' + getComputedStyle(box).display,
    '行数=' + rows.length,
    '行高=' + rows.map(function (r) { return r.offsetHeight; }).join(','));
  rows.forEach(function (r, i) {
    var rest = r.querySelector('.v2-ccard__mc-rest');
    P('  行' + (i + 1) + ' 类型=' + r.querySelector('.v2-ccard__mc-type').textContent +
      ' 卡名=' + r.querySelector('.v2-ccard__mc-name').textContent +
      ' 权益=' + rest.textContent +
      ' 类型宽=' + r.querySelector('.v2-ccard__mc-type').offsetWidth +
      ' 卡名宽=' + r.querySelector('.v2-ccard__mc-name').offsetWidth +
      ' 权益宽=' + rest.offsetWidth +
      ' 权益右缘距卡内右=' + Math.round(card.getBoundingClientRect().right - rest.getBoundingClientRect().right - 16));
  });
  wrap.style.transition = prev;
}
var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) {
    var pre = document.createElement('pre');
    pre.textContent = log.join('\n');
    document.body.appendChild(pre);
    return;
  }
  var fn = steps.shift();
  try { fn(); } catch (e) { log.push('ERR ' + e.message); }
  setTimeout(next, 320);
}
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 400); }, 400);

  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_female3.png',
      lastVisit: '2026-08-15', cards: '3', balance: '2049', discount: '8.0', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.setCust('member'); w.go('s5');
  });
  S(function () { q('#s5 .nav-cust').click(); });           /* 展开顾客卡 */
  S(function () { q('#s5 [data-ccard-wrap] .v2-ccard__chev').click(); });      /* 展开持卡列表 */
  S(function () { geo('A s5 会员卡展开(3行)', 's5'); });
  S(function () {
    w.__v2Member = { name: '赵小姐', gender: 'female', avatar: 'assets/avatar_card_female.png',
      lastVisit: '2026-09-18', cards: '0', balance: '0', discount: '—', isNew: true };
    w.__v2MemberNoBenefit = true;
    w.go('s5');
  });
  S(function () { q('#s5 .nav-cust').click(); });
  S(function () {
    var wrap = q('#s5 [data-ccard-wrap]');
    var prev = wrap.style.transition; wrap.style.transition = 'none'; void wrap.offsetWidth;
    P('B 新会员(无卡)', 'wrap高=' + wrap.offsetHeight,
      '空态=' + (q('#s5 .v2-ccard__cards.is-empty') ? q('#s5 .v2-ccard__cards.is-empty').textContent : 'MISS'),
      '行数=' + d.querySelectorAll('#s5 [data-ccard-wrap] .v2-ccard__mc').length);
    wrap.style.transition = prev;
  });
  /* 结算页淡色卡 */
  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_female3.png',
      lastVisit: '2026-08-15', cards: '3', balance: '2049', discount: '8.0', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.setCust('member'); w.go('s5');
  });
  S(function () { q('#s5 .v2-cat-item .v2-add-btn').click(); });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });
  S(function () { q('[data-next="s5"]').click(); });
  S(function () {
    var card = q('#s6 .member-card.v2-lite');
    P('C s6 淡色会员卡 =', card ? 'FOUND 行数=' + card.querySelectorAll('.v2-ccard__mc').length +
      ' 首行=' + Array.prototype.slice.call(card.querySelectorAll('.v2-ccard__mc')).map(function (r) {
        return r.textContent.replace(/\s+/g, '');
      }).join(' / ') : 'MISS');
    if (card) {
      var prev = card.style.transition;
      void card.offsetWidth;
      P('C s6 卡高(收起) =', card.offsetHeight);
      var chev = card.querySelector('.v2-ccard__chev');
      if (chev) chev.click();
      setTimeout(function () { P('C s6 卡高(展开) =', card.offsetHeight); }, 200);
    }
  });
});
</script>
</body></html>
