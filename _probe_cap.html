<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
var f = document.getElementById('f');
var out = document.getElementById('out');
var t0 = Date.now();
var done = false;
var iv = setInterval(function () {
  var w, d;
  try { w = f.contentWindow; d = w ? w.document : null; } catch (e) { return; }
  if (done || !w || !d || typeof w.__v2SyncHold !== 'function') return;
  if (Date.now() - t0 < 2500) return;
  done = true;
  var mask = d.getElementById('addSheetMask');
  var vis = Array.prototype.filter.call(d.querySelectorAll('.screen'), function (s) {
    return getComputedStyle(s).display !== 'none';
  }).map(function (s) { return s.id; }).join(',');
  out.textContent = 'ms=' + (Date.now() - t0) + ' visible=' + vis +
    ' sheet=' + (mask ? mask.className : '-') +
    ' draft=' + (w.__v2DraftStaff ? 'set' : 'null') +
    ' cart=' + w.cartItems.length +
    ' 确定钮=' + (d.querySelector('#addSheetMask .addsheet__foot .btn-confirm') ? 'y' : 'n') +
    ' 参=+capture=s1-expand';
  clearInterval(iv);
}, 200);
f.src = 'index.html?capture=s1-expand&bust=' + Date.now();
</script>
</body></html>
