<script>
var log = [], pass = 0, fail = 0;
function P() { log.push([].slice.call(arguments).join(' ')); }
var fails = [];
function ok(name, cond, extra) {
  if (cond) { pass++; P('✓ ' + name + (extra ? '  ' + extra : '')); }
  else { fail++; fails.push(name + (extra ? '  ' + extra : '')); P('✗ ' + name + (extra ? '  ' + extra : '')); }
}
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function cs(e, p) { if (typeof e === 'string') e = q(e); return e ? getComputedStyle(e)[p] : 'none'; }
function txt(s) { var e = q(s); return e ? e.textContent.trim() : 'none'; }
function active() { var e = q('.screen.active'); return e ? e.id : 'none'; }
function frameBottom() { var e = q('.screen.active'); return e ? R(e).b : 844; }
function R(e) {
  if (typeof e === 'string') e = q(e);
  if (!e) return null;
  var r = e.getBoundingClientRect(), k = 1 / 1.25;
  return { l: +(r.left * k).toFixed(1), r: +(r.right * k).toFixed(1),
           t: +(r.top * k).toFixed(1), b: +(r.bottom * k).toFixed(1),
           w: +(r.width * k).toFixed(1), h: +(r.height * k).toFixed(1) };
}
function rules(sel) {
  var out = [];
  for (var i = 0; i < d.styleSheets.length; i++) {
    var ss = d.styleSheets[i], list;
    try { list = ss.cssRules; } catch (e) { continue; }
    if (!list) continue;
    for (var j = 0; j < list.length; j++) {
      var r = list[j];
      if (r.selectorText && r.selectorText.indexOf(sel) >= 0) out.push(r);
      if (r.cssRules) for (var k = 0; k < r.cssRules.length; k++) {
        var r2 = r.cssRules[k];
        if (r2.selectorText && r2.selectorText.indexOf(sel) >= 0) out.push(r2);
      }
    }
  }
  return out;
}
function cssRulesFor(sel) {
  return rules(sel).map(function (r) { return r.cssText.replace(/\s+/g, ' '); }).join(' | ');
}
var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) return finish();
  var fn = steps.shift();
  try { fn(); } catch (e) { P('ERR ' + e.message); fail++; }
  setTimeout(next, 320);
}
function finish() {
  P('');
  P('========= 结果：' + pass + ' 通过 / ' + fail + ' 失败 =========');
  if (fails.length) { P(''); P('失败清单：'); fails.forEach(function (x, i) { P('  ' + (i + 1) + '. ' + x); }); }
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}
