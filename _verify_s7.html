<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
/* s7 快捷开单结算：散客 / 会员 两种身份的权益·券·结账 toast */
var log = [];
function P(k, v) { log.push(k + ' = ' + v); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return Array.prototype.slice.call(d.querySelectorAll(s)); }
function vis() { return Array.prototype.slice.call(d.querySelectorAll('.screen')).filter(function (s) { return getComputedStyle(s).display !== 'none'; }).map(function (s) { return s.id; }); }
function onRd(sel) { return qa(sel).map(function (x, i) { var im = x.querySelector('img'); return im && /ic_radio_on/.test(im.getAttribute('src')) ? i : -1; }).filter(function (i) { return i >= 0; }).join(','); }
function snap(tag, sel) {
  P(tag + ' 权益值', qa(sel + ' .co-item .co-row[data-benefit] .val').map(function (e) { return e.textContent.replace(/\s+/g, ''); }).join(','));
  P(tag + ' 券行', (q(sel + ' [data-coupon-val]') || {}).innerText.replace(/\s+/g, ''));
  P(tag + ' 各项应付', qa(sel + ' .co-item .co-sum-row .num').map(function (e) { return e.textContent; }).join(','));
  P(tag + ' 底栏', (q(sel === '#s7' ? '#qcoPay' : '#coPay') || {}).textContent);
}
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  function finish() {
    var pre = document.createElement('pre');
    pre.textContent = log.join('\n');
    document.body.appendChild(pre);
  }
  setTimeout(function () {
    try { run(); } catch (e) { log.push('ERR: ' + e.message); finish(); }
  }, 800);
  function run() {
    /* ---- 散客快捷开单（正常入口：入栈 s7） ---- */
    w.setCust('guest'); w.setQcoCust('guest');
    w.goQuickCheckout();
    P('A s7 页', vis());
    P('A navStack', w.navStack.join('>'));
    P('A s7 title', (q('#s7 .nav-bar .title, #s7 .title') || {}).textContent);
    snap('A 散客', '#s7');
    P('A qcoItem 金额', w.qcoItem ? w.qcoItem.price : '-');
    P('A 券对象', w.__v2OrderCoupon ? w.__v2OrderCoupon.name : 'null');

    /* 从 s7 进 s12 选权益 → 确认回 s7 */
    q('#s7 .co-item .co-row[data-benefit] .val').click();
    P('B s12', vis());
    P('B s12 选中', onRd('#benList .ben-row'));
    qa('#benList .ben-row')[1].click();
    q('#s12 .pick-foot .ok').click();
    P('C 确认后回页', vis());
    snap('C 选5折后', '#s7');

    /* 从 s7 进 s13（返回不生效） */
    q('#s7 [data-coupon-val]').click();
    P('D s13', vis());
    P('D 单选(none|卡)', onRd('#cpList .cp-none') + '|' + onRd('#cpList .cp-card .cp-rd'));
    P('D 规则默认展开数', qa('#cpList .cp-rules').length);
    qa('#cpList .cp-card')[0].querySelector('.cp-rule').click();
    P('D 点开规则后 cards-open', qa('#cpList .cp-card.is-open').length);
    qa('#cpList .cp-card')[0].querySelector('.cp-rule').click();
    q('#s13 .nav-bar .btn-back').click();
    P('E 返回后页', vis());
    snap('E 未确认不生效', '#s7');
    q('#s7 [data-coupon-val]').click();
    P('E2 再进 s13 规则展开数', qa('#cpList .cp-rules').length);
    q('#cpList .cp-none').click();
    q('#s13 .pick-foot .ok').click();
    P('E3 选不使用后 券行', (q('#s7 [data-coupon-val]') || {}).innerText.replace(/\s+/g, ''));
    P('E3 选不使用后 底栏', q('#qcoPay').textContent);
    q('#s7 [data-coupon-val]').click();
    qa('#cpList .cp-card')[0].click();
    q('#s13 .pick-foot .ok').click();
    P('E4 选回10元券 底栏', q('#qcoPay').textContent);

    /* 结账 → toast */
    var btn = qa('#s7 button').filter(function (b) { return b.textContent.replace(/\s/g, '').indexOf('结账') >= 0; })[0];
    P('F 结账按钮', btn ? btn.textContent.replace(/\s/g, '') : 'NOT FOUND');
    btn.click();
    P('F toast', (q('#toast') || {}).innerText);
    P('F 停留页', vis());
    P('F 明细仍在', w.qcoItem ? w.qcoItem.name : 'null');
    P('F navStack', w.navStack.join('>'));

    /* ---- 会员快捷开单：自动匹配最优折扣卡 ---- */
    w.setCust('member'); w.setQcoCust('member');
    w.__v2OrderCoupon = null; w.__v2OrderCouponTouched = false;
    w.qcoItem.benefit = null; w.qcoItem._benefitCleared = false; w.qcoItem._benefitAuto = false;
    w.__v2MemberNoBenefit = false;
    w.renderQco();
    snap('G 会员', '#s7');
    P('G 会员 autoBenefitFor(member)', w.autoBenefitFor ? String(w.autoBenefitFor('member') ? w.autoBenefitFor('member').name : 'null') : 'N/A');
    P('G 券对象(会员不自动带券)', w.__v2OrderCoupon ? w.__v2OrderCoupon.name : 'null');
    P('G 会员 自动标记', String(!!w.qcoItem._benefitAuto) + '/' + String(!!w.qcoItem._benefitCleared));

    /* 会员改价/不使用权益 → 锁定，不再被自动覆盖 */
    q('#s7 .co-item .co-row[data-benefit] .val').click();
    P('H s12 选中行', onRd('#benList .ben-row'));
    qa('#benList .ben-row')[0].click();
    q('#s12 .pick-foot .ok').click();
    snap('H 选不使用权益', '#s7');
    P('H 锁定标记', String(!!w.qcoItem._benefitAuto) + '/' + String(!!w.qcoItem._benefitCleared));
    w.renderQco();
    snap('H2 重渲后不被覆盖', '#s7');

    /* 切散客：自动匹配按新身份重算（此前为手工选择 → 保留） */
    q('#s7 .co-item .co-row[data-benefit] .val').click();
    qa('#benList .ben-row')[4].click();
    q('#s12 .pick-foot .ok').click();
    snap('I 手工选折扣卡', '#s7');
    w.setQcoCust('guest'); w.renderQco();
    snap('I2 切散客(手工选择保留)', '#s7');
    w.setQcoCust('member'); w.renderQco();
    snap('I3 切回会员(手工选择保留)', '#s7');
    finish();
  }
});
</script>
</body></html>
