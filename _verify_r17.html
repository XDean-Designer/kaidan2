<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = [], pass = 0, fail = 0;
function P() { log.push([].slice.call(arguments).join(' ')); }
function ok(name, cond, extra) {
  if (cond) { pass++; P('✓ ' + name + (extra ? '  ' + extra : '')); }
  else { fail++; P('✗ ' + name + (extra ? '  ' + extra : '')); }
}
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d, YOFF = null; /* 原型 1.25 缩放 + 舞台纵向偏移，用 .suc-head(top:98) 标定 */
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function R(e) {
  if (typeof e === 'string') e = q(e);
  if (!e) return null;
  var r = e.getBoundingClientRect(), k = 1 / 1.25;
  return { l: Math.round(r.left * k * 10) / 10, r: Math.round(r.right * k * 10) / 10,
           t: Math.round(r.top * k * 10) / 10, b: Math.round(r.bottom * k * 10) / 10,
           w: Math.round(r.width * k * 10) / 10, h: Math.round(r.height * k * 10) / 10 };
}
function RK(e) { var r = R(e); if (!r || YOFF === null) return r; r.t = Math.round((r.t - YOFF) * 10) / 10; r.b = Math.round((r.b - YOFF) * 10) / 10; return r; }
function cs(e, p) { if (typeof e === 'string') e = q(e); return e ? getComputedStyle(e)[p] : 'none'; }
function txt(s) { var e = q(s); return e ? e.textContent.trim() : 'none'; }
var steps = [];
function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { P('ERR ' + e.message); fail++; } setTimeout(next, 280); }
function finish() {
  P('');
  P('========= 结果：' + pass + ' 通过 / ' + fail + ' 失败 =========');
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}

f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);

  /* ============ s4 胶囊（R17 方案 C：纯文字 + 发丝竖线） ============ */
  S(function () { w.go('s4'); });
  S(function () {
    var wrap = q('#s4 .pick-row-wrap'), act = q('#s4 .pick-row-actions'),
        main = q('#s4 .pick-seg--main'), sec = q('#s4 .pick-seg--sec'),
        div = q('#s4 .pick-seg__div'), idx = q('#s4 .index-bar');
    var A = R(act), I = R(idx), M = R(main), W = R(wrap);
    P('— s4 胶囊（R17 方案 C）—');
    P('  wrap ' + JSON.stringify(W) + '  actions ' + JSON.stringify(A) + '  index-bar ' + JSON.stringify(I));
    ok('1. 控件无边框无底色', cs(act, 'borderTopWidth') === '0px' && cs(act, 'backgroundColor') === 'rgba(0, 0, 0, 0)',
      'border=' + cs(act, 'borderTopWidth') + ' bg=' + cs(act, 'backgroundColor'));
    ok('2. 开单=红字600 / 透明底', cs(main, 'color') === 'rgb(243, 47, 65)' && cs(main, 'fontWeight') === '600' && cs(main, 'backgroundColor') === 'rgba(0, 0, 0, 0)',
      cs(main, 'color') + ' / ' + cs(main, 'fontWeight'));
    ok('3. 收款=灰字500', cs(sec, 'color') === 'rgb(142, 142, 147)' && cs(sec, 'fontWeight') === '500', cs(sec, 'color') + ' / ' + cs(sec, 'fontWeight'));
    ok('4. 中缝 1×14 竖线 #E5E5E5', !!div && Math.abs(R(div).w - 1) < 0.3 && Math.abs(R(div).h - 14) < 0.6 && cs(div, 'backgroundColor') === 'rgb(229, 229, 229)',
      div ? JSON.stringify(R(div)) + ' ' + cs(div, 'backgroundColor') : 'none');
    ok('5. 每段热区高 ≥44', M.h >= 44 && R(sec).h >= 44, 'main h=' + M.h + ' sec h=' + R(sec).h);
    ok('6. 行内距右 30 → 胶囊右缘 360', Math.abs(W.r - A.r - 30) < 1.5, 'wrap.r=' + W.r + ' act.r=' + A.r + ' 差=' + (W.r - A.r));
    ok('7. 与索引条净空 ≥10px（消除原 8px 重叠）', I.l - A.r >= 9.5, '胶囊右缘 ' + A.r + ' / 索引条左 ' + I.l + ' → 净空 ' + Math.round((I.l - A.r) * 10) / 10);
    ok('8. 17 行控件都在（未误删行）', qa('#s4 .pick-row-actions').length === 17, '控件数=' + qa('#s4 .pick-row-actions').length);
    ok('9. 控件总宽 ≤110（比原 103 不更宽）', A.w <= 110, '宽=' + A.w + '（原 103）');
  });

  /* ============ sheet 顾客指定 标签色（R17 曾为橙，R18 起回主文字色） ============ */
  S(function () { w.go('s1'); });
  S(function () { q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () {
    var lbl = q('#asStaffGrid .sp-row--extra .sp-row__lbl');
    var normal = qa('#asStaffGrid .sp-row__lbl').filter(function (e) { return !e.closest('.sp-row--extra'); })[0];
    P('— sheet「顾客指定」标签色（R18：主文字色）—');
    ok('10. 「顾客指定」= #1A1A1A（R18 改回主文字色）', !!lbl && getComputedStyle(lbl).color === 'rgb(26, 26, 26)', lbl ? getComputedStyle(lbl).color : 'none');
    ok('11. 其余工位标签仍为 #1A1A1A', !!normal && getComputedStyle(normal).color === 'rgb(26, 26, 26)', normal ? getComputedStyle(normal).color : 'none');
    ok('12. 只有 1 个 extra 行，4 行工位齐全', qa('#asStaffGrid .sp-row--extra').length === 1 &&
      qa('#asStaffGrid .sp-row__lbl').map(function (e) { return e.textContent.trim(); }).join('/') === '大工/中工/小工/顾客指定',
      qa('#asStaffGrid .sp-row__lbl').map(function (e) { return e.textContent.trim(); }).join('/'));
  });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });

  /* ============ s15 打印小票 ============ */
  S(function () { w.go('s6'); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    YOFF = Math.round(R('#s15 .suc-head').t - 98);   /* 舞台纵向偏移（逻辑 px） */
    P('— s15「打印小票」（R17 改版）— 舞台纵向偏移 = ' + YOFF + 'px');
    var row = q('#s15 .suc-print-row'), card = q('#s15 .suc-card'), body = q('#s15 .suc-body'),
        rowsEl = q('#s15 .suc-rows'), acts = q('#s15 .suc-acts'), amt = q('#s15 .suc-amt');
    var PR = RK(row), CR = RK(card), BR = RK(body), RR = RK(rowsEl), AC = RK(acts), AR = RK(amt);
    P('  几何（已扣偏移）：body.top=' + BR.t + ' 卡 ' + CR.t + '→' + CR.b + '（高 ' + CR.h + '）明细 bottom=' + RR.b +
      ' 入口 ' + PR.t + '→' + PR.b + ' 操作带 ' + AC.t + '→' + AC.b);
    ok('13. 卡内右上角旧图标已删除', !q('#s15 .suc-print'), q('#s15 .suc-print') ? '仍存在' : '已删除');
    ok('14. 新入口是卡片最后一个子元素', !!row && !!card && card.lastElementChild === row,
      row ? ('最后一个子元素 = ' + card.lastElementChild.className) : 'none');
    ok('15. 入口在明细区下方', !!row && !!rowsEl && PR.t >= RR.b - 1, '入口 top=' + PR.t + ' / 明细 bottom=' + RR.b);
    ok('16. 整行热区：高 44 / 宽与卡内字段行齐平（R19 由 46 改 44）', Math.abs(PR.h - 44) < 1.2 && Math.abs(PR.w - AR.w) < 1.2,
      PR.w + '×' + PR.h + '（卡内字段行宽 ' + AR.w + '）');
    ok('17. 上方 0.5px 灰色实线', cs(row, 'borderTopWidth') !== '0px' && parseFloat(cs(row, 'borderTopWidth')) <= 1 &&
      cs(row, 'borderTopColor') === 'rgb(229, 229, 229)', cs(row, 'borderTopWidth') + ' ' + cs(row, 'borderTopColor'));
    ok('18. 图标 18px #8E8E93 / 文案 13px #55595E（R19 尺寸 17→18、改线描稿）',
      cs(row, 'fontSize') === '13px' && cs(row, 'color') === 'rgb(85, 89, 94)' && !!row.querySelector('svg') &&
      Math.abs(R(row.querySelector('svg')).w - 18) < 0.6 && cs(row.querySelector('svg'), 'color') === 'rgb(142, 142, 147)',
      cs(row, 'fontSize') + ' ' + cs(row, 'color') + ' icon=' + (row.querySelector('svg') ? R(row.querySelector('svg')).w : '-'));
    ok('19. 文案 = 打印小票', row.textContent.trim() === '打印小票', JSON.stringify(row.textContent.trim()));
    ok('20. 卡片上移：内容区 top 由 182 → 138', cs(body, 'top') === '138px' && Math.abs(BR.t - 138) < 2,
      'css top=' + cs(body, 'top') + ' / 实测 ' + BR.t);
    ok('21. 卡底不高过原位置 +8px（上移量补掉新增行）', CR.b - 440.5 <= 8, '卡底=' + CR.b + '（改动前 440.5）');
    ok('22. 卡内新增高度 ≈ 38（44 行 − 6 收回的底部内距；R19 由 40 改 38）', Math.abs((CR.h - 246.3) - 38) <= 2, '卡高=' + CR.h + '（改动前 246.3）');
    ok('23. 卡内不产生滚动（内容不被挤爆）', q('#s15 .suc-body').scrollHeight <= q('#s15 .suc-body').clientHeight + 1,
      'scrollH=' + q('#s15 .suc-body').scrollHeight + ' clientH=' + q('#s15 .suc-body').clientHeight);
    ok('24. 卡外操作带仍 4 项 / 高 62 / 间距 14', qa('#s15 .suc-act').length === 4 && Math.abs(AC.h - 62) < 1.5 && Math.abs(AC.t - CR.b - 14) < 1.5,
      qa('#s15 .suc-act').length + ' 项 / 高 ' + AC.h + ' / 间距 ' + Math.round((AC.t - CR.b) * 10) / 10);
    ok('25. 底栏 3 按钮不变（返回首页 / 客户签字 / 继续开单）',
      qa('#s15 .suc-bar button').length === 3, qa('#s15 .suc-bar button').map(function (e) { return e.textContent.trim() || 'ico-home'; }).join('/'));
    ok('26. 操作组 4 项文案不变', qa('#s15 .suc-act').map(function (e) { return e.textContent.trim(); }).join('/') === '改日期/改单号/看流水/客户详情',
      qa('#s15 .suc-act').map(function (e) { return e.textContent.trim(); }).join('/'));
  });
  S(function () { q('#s15 .suc-print-row').click(); });
  S(function () {
    ok('27. 点入口 → toast「已发送打印小票指令」', /已发送打印小票指令/.test(txt('#toast')), txt('#toast'));
    ok('28. 停留在 s15（不跳转）', q('#s15').classList.contains('on') || getComputedStyle(q('#s15')).display !== 'none',
      '当前页=' + (q('#s15').className));
  });
});
</script>
</body></html>
