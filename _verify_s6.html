<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<iframe id="f" style="width:390px;height:844px;border:0;display:block"></iframe>
<script>
(function(){
  var f = document.getElementById('f');
  f.src = 'index.html?bust=' + Date.now();
  function waitReady(cb) {
    var n = 0;
    (function tick(){
      n++;
      try {
        var w = f.contentWindow, d = w.document;
        if (d && d.querySelector('#s1 .proj-card .add')) return cb(w, d);
      } catch(e) {}
      if (n < 80) setTimeout(tick, 100);
      else document.title = 'FAIL_LOAD';
    })();
  }
  f.onload = function(){
    waitReady(function(w, d){
      var btns = d.querySelectorAll('#s1 .proj-card .add');
      btns[0].click();
      setTimeout(function(){
        w.confirmAddSheet();
        setTimeout(function(){
          btns[1].click();
          setTimeout(function(){
            w.confirmAddSheet();
            setTimeout(function(){
              w.nextStep('s1');
              setTimeout(function(){
                var man = d.getElementById('coManualNo');
                var s6 = d.getElementById('s6');
                var detail = d.querySelector('#s6 .co-emp-detail');
                var unset = d.querySelector('#s6 .co-emp-detail .unset');
                var sum = d.querySelector('#s6 .co-sum-row');
                var note = d.querySelector('#s6 .co-note');
                var help = d.querySelector('#s6 .co-row .help');
                document.title = [
                  'S6',
                  s6 && s6.classList.contains('active') ? 'ON' : 'OFF',
                  man ? man.value : 'NOMAN',
                  man ? (man.getAttribute('placeholder') || '') : '',
                  detail ? 'DETAIL_OK' : 'DETAIL_MISS',
                  unset ? unset.textContent.trim() : 'NO_UNSET',
                  sum ? 'SUM_OK' : 'SUM_MISS',
                  note ? 'NOTE_BAD' : 'NOTE_GONE',
                  help ? 'HELP_OK' : 'HELP_MISS'
                ].join('|');
              }, 400);
            }, 300);
          }, 300);
        }, 300);
      }, 300);
    });
  };
})();
</script>
</body></html>
