<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<iframe id="f" style="width:390px;height:844px;border:0;display:block"></iframe>
<script>
/* R3 版 s6 结算页断言：无单号卡片 / 无日期入口 / 明细正常 / 结账 → s15（清空明细与角标） */
(function () {
  var log = [];
  var f = document.getElementById('f');
  f.src = 'index.html?bust=' + Date.now();
  function fin(w, d) {
    var pre = document.createElement('pre');
    pre.textContent = log.join('\n');
    document.body.appendChild(pre);
    document.title = 'S6 ' + log.length + ' lines';
  }
  f.addEventListener('load', function () {
    var w, d;
    setTimeout(function () {
      w = f.contentWindow; d = f.contentDocument;
      w.setCust('guest'); w.go('s1');
      setTimeout(function () {
        var b = d.querySelector('#s1 .v2-cat-item .v2-add-btn');
        log.push('1 圆钮存在 = ' + !!b);
        b.click();
        setTimeout(function () {
          var ok = d.querySelector('#addSheetMask .addsheet__foot .btn-confirm');
          log.push('2 sheet 确定按钮 = ' + !!ok);
          ok.click();
          setTimeout(function () {
            log.push('3 购物车条数 = ' + w.cartItems.length);
            var nx = d.querySelector('[data-next="s1"]');
            nx.click();
            setTimeout(function () {
              log.push('4 页面 = ' + Array.prototype.slice.call(d.querySelectorAll('.screen'))
                .filter(function (s) { return getComputedStyle(s).display !== 'none'; }).map(function (s) { return s.id; }).join(','));
              log.push('5 s6 单号卡片(应为 null) = ' + d.querySelector('#coManualNo'));
              log.push('6 s6 日期入口数(应为 0) = ' + d.querySelectorAll('#s6 [data-date-ctl]').length);
              log.push('7 s6 明细行 = ' + d.querySelectorAll('#s6 .co-item').length);
              log.push('8 底栏应付 = ' + (d.querySelector('#coPay') || {}).textContent);
              var btn = Array.prototype.slice.call(d.querySelectorAll('#s6 button'))
                .filter(function (x) { return x.textContent.replace(/\s/g, '') === '结账'; })[0];
              log.push('9 结账按钮 = ' + !!btn);
              btn.click();
              setTimeout(function () {
                log.push('10 toast = ' + (d.querySelector('#toast') || {}).innerText);
                log.push('11 页面 = ' + Array.prototype.slice.call(d.querySelectorAll('.screen'))
                  .filter(function (s) { return getComputedStyle(s).display !== 'none'; }).map(function (s) { return s.id; }).join(','));
                log.push('12 明细清空 = ' + w.cartItems.length);
                var bd = d.querySelector('#s1 [data-cart-badge]');
                log.push('13 角标 = ' + (bd ? bd.textContent + (bd.classList.contains('show') ? '/show' : '/hide') : 'N/A'));
                log.push('14 s15 金额/单号 = ' + (d.querySelector('#sucAmt') || {}).textContent + ' / ' + (d.querySelector('#sucNo') || {}).textContent);
                fin(w, d);
              }, 500);
            }, 600);
          }, 400);
        }, 300);
      }, 400);
    }, 600);
  });
})();
</script>
</body></html>
