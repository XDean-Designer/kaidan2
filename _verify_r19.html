<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = [], pass = 0, fail = 0;
function P() { log.push([].slice.call(arguments).join(' ')); }
function ok(name, cond, extra) {
  if (cond) { pass++; P('✓ ' + name + (extra ? '  ' + extra : '')); }
  else { fail++; P('✗ ' + name + (extra ? '  ' + extra : '')); }
}
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d, YOFF = null;
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function cs(e, p) { if (typeof e === 'string') e = q(e); return e ? getComputedStyle(e)[p] : 'none'; }
function txt(s) { var e = q(s); return e ? e.textContent.trim() : 'none'; }
function active() { var e = q('.screen.active'); return e ? e.id : 'none'; }
function R(e) {
  if (typeof e === 'string') e = q(e);
  if (!e) return null;
  var r = e.getBoundingClientRect(), k = 1 / 1.25;
  return { l: +(r.left * k).toFixed(1), r: +(r.right * k).toFixed(1),
           t: +(r.top * k).toFixed(1), b: +(r.bottom * k).toFixed(1),
           w: +(r.width * k).toFixed(1), h: +(r.height * k).toFixed(1) };
}
function RK(e) { var r = R(e); if (!r || YOFF === null) return r; r.t = +(r.t - YOFF).toFixed(1); r.b = +(r.b - YOFF).toFixed(1); return r; }

/* 取原型样式表里所有命中某选择器的规则（用于静态断言 :active 之类无法在无头里触发的状态） */
function rules(sel) {
  var out = [];
  for (var i = 0; i < d.styleSheets.length; i++) {
    var ss = d.styleSheets[i], list;
    try { list = ss.cssRules; } catch (e) { continue; }
    if (!list) continue;
    for (var j = 0; j < list.length; j++) {
      var r = list[j];
      if (r.selectorText && r.selectorText.indexOf(sel) >= 0) out.push(r);
      if (r.cssRules) { /* 嵌套 @media 等 */
        for (var k = 0; k < r.cssRules.length; k++) {
          var r2 = r.cssRules[k];
          if (r2.selectorText && r2.selectorText.indexOf(sel) >= 0) out.push(r2);
        }
      }
    }
  }
  return out;
}
function cssRulesFor(sel) {
  return rules(sel).map(function (r) { return r.cssText.replace(/\s+/g, ' '); }).join(' | ');
}

var steps = [];
function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { P('ERR ' + e.message); fail++; } setTimeout(next, 300); }
function finish() {
  P('');
  P('========= 结果：' + pass + ' 通过 / ' + fail + ' 失败 =========');
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}

f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);

  /* 走真实开单流程进入 s15（保证卡片数据与真实场景一致） */
  S(function () { w.go('s1'); });
  S(function () { var b = q('#s1 .v2-cat-item .v2-add-btn'); if (b) b.click(); });
  S(function () { var b = q('#asStaffGrid .sp-row .sp-cell, #asStaffGrid .sp-cell'); if (b) b.click(); });
  S(function () {
    var c = q('#addSheetMask .addsheet__foot .btn-confirm');
    if (c) c.click();
  });
  S(function () { w.go('s6'); });
  S(function () {
    var c = q('#s6 .co-bar .btn-c');
    if (c) c.click();
  });
  S(function () {
    if (active() !== 's15') w.go('s15');
    YOFF = Math.round(R('#s15 .suc-head').t - 98);
  });

  /* ============ A. 图标：换成 24 画布线描稿 ============ */
  S(function () {
    P('— A. 打印小票图标（R19：200 填充式 → 24 线描）—');
    var row = q('#s15 .suc-print-row'), svg = row && row.querySelector('svg');
    ok('1. 行的 svg 存在且唯一', !!svg && row.querySelectorAll('svg').length === 1, !!svg ? 'viewBox=' + svg.getAttribute('viewBox') : 'none');
    if (!svg) return;
    ok('2. viewBox 换成 24 画布（原 0 0 200 200）', svg.getAttribute('viewBox') === '0 0 24 24', svg.getAttribute('viewBox'));
    ok('3. fill=none + stroke=currentColor（线描，非填充）',
      svg.getAttribute('fill') === 'none' && svg.getAttribute('stroke') === 'currentColor',
      'fill=' + svg.getAttribute('fill') + ' stroke=' + svg.getAttribute('stroke'));
    ok('4. stroke-width=1.6', svg.getAttribute('stroke-width') === '1.6', svg.getAttribute('stroke-width'));
    ok('5. 线端线角圆头（stroke-linecap/linejoin=round）',
      svg.getAttribute('stroke-linecap') === 'round' && svg.getAttribute('stroke-linejoin') === 'round',
      svg.getAttribute('stroke-linecap') + '/' + svg.getAttribute('stroke-linejoin'));
    ok('6. 打印机结构：3 段线（进纸/机身/出纸）+ 1 枚指示灯',
      svg.querySelectorAll('path').length === 3 && svg.querySelectorAll('circle').length === 1,
      'path=' + svg.querySelectorAll('path').length + ' circle=' + svg.querySelectorAll('circle').length);
    var paths = qa('#s15 .suc-print-row svg path').map(function (p) { return p.getAttribute('d'); }).join('');
    ok('7. 三段线的几何都在 24 画布内（0..24，无 200 画布残留）',
      /M7 8\.2V4\.6/.test(paths) && /M7 16\.6H5\.6/.test(paths) && /M7 14h10/.test(paths) && !/163\.158|182\.105/.test(paths),
      paths.slice(0, 46) + '…');
    ok('8. 指示灯用 currentColor 实心（随主题色，不写死）',
      svg.querySelector('circle').getAttribute('fill') === 'currentColor' && svg.querySelector('circle').getAttribute('stroke') === 'none',
      svg.querySelector('circle').getAttribute('fill'));
    /* 渲染线宽 = stroke-width / 24 * 实际渲染尺寸 */
    var size = R(svg).w, rendered = 1.6 / 24 * size;
    ok('9. 渲染线宽 ≥1.1px（原稿 ≈0.50px，R19 目标 ≈1.2px）', rendered >= 1.1,
      '渲染 ' + size + 'px → 线宽 ' + rendered.toFixed(2) + 'px');
    ok('10. 图标 18px（原 17px）', Math.abs(size - 18) < 0.6, size + 'px');
  });

  /* ============ B. 行形态：去按钮感 ============ */
  S(function () {
    P('— B. 底部行形态（R19：去圆角 / 去底色 / 行高 44）—');
    var row = q('#s15 .suc-print-row'), card = q('#s15 .suc-card'), rowsEl = q('#s15 .suc-rows');
    var PR = RK(row), RR = RK(rowsEl);
    ok('11. 去圆角：border-radius = 0（原 12）', cs(row, 'borderRadius') === '0px', cs(row, 'borderRadius'));
    ok('12. 去底色：background 透明（原 :active 整行 #F7F7F8）',
      cs(row, 'backgroundColor') === 'rgba(0, 0, 0, 0)', cs(row, 'backgroundColor'));
    ok('13. 上方仍是 0.5px 实线 #E5E5E5（上＝信息 / 下＝操作）',
      cs(row, 'borderTopStyle') === 'solid' && parseFloat(cs(row, 'borderTopWidth')) <= 1 &&
      cs(row, 'borderTopColor') === 'rgb(229, 229, 229)',
      cs(row, 'borderTopWidth') + ' ' + cs(row, 'borderTopStyle') + ' ' + cs(row, 'borderTopColor'));
    ok('14. 行高 44（与字段行 min-height:44 同节奏）',
      cs(row, 'height') === '44px' && cs('#s15 .suc-row', 'minHeight') === '44px',
      'row=' + cs(row, 'height') + ' / 字段行 min-height=' + cs('#s15 .suc-row', 'minHeight') + ' / 实测 ' + PR.h);
    ok('15. 行宽与字段行齐平（同左右边距，纯行不悬浮）', Math.abs(PR.w - RR.w) < 1, PR.w + ' vs ' + RR.w);
    ok('16. 仍是卡片最后一个子元素', card.lastElementChild === row, card.lastElementChild.className);
    ok('17. 文案 / 字号 / 字色不变：打印小票 13px #55595E',
      row.textContent.trim() === '打印小票' && cs(row, 'fontSize') === '13px' && cs(row, 'color') === 'rgb(85, 89, 94)',
      JSON.stringify(row.textContent.trim()) + ' ' + cs(row, 'fontSize') + ' ' + cs(row, 'color'));
    ok('18. 整行仍是热区（button，宽 = 卡内字段行宽）', row.tagName === 'BUTTON' && row.getAttribute('data-suc-print') !== null && PR.w > 300,
      row.tagName + ' ' + PR.w + '×' + PR.h);
  });

  /* ============ C. 按下反馈：文字 + 图标加深，且不出现底色 ============ */
  S(function () {
    P('— C. 按下反馈（R19：仅加深，无底色）—');
    var css = cssRulesFor('#s15 .suc-print-row');
    ok('19. 不再有 :active 整行浅底 #F7F7F8',
      !/:active[^{]*\{[^}]*background[^}]*#F7F7F8/i.test(css) && !/:active[^{]*\{[^}]*F7F7F8/i.test(css.replace(/\s/g, '')),
      css.indexOf('F7F7F8') >= 0 ? '仍含 F7F7F8' : '已无 F7F7F8');
    ok('20. :active 只改文字色 → #1a1a1a', /:active[^{]*\{[^}]*color:\s*(#1a1a1a|rgb\(26,\s*26,\s*26\))/i.test(css),
      (css.match(/#s15 \.suc-print-row:active[^{]*\{[^}]*\}/i) || ['none'])[0].slice(0, 80));
    ok('21. :active 时图标 #55595E（svg 单独再深一档）',
      /:active svg[^{]*\{[^}]*color:\s*(#55595E|rgb\(85,\s*89,\s*94\))/i.test(css),
      (css.match(/:active svg[^{]*\{[^}]*\}/i) || ['none'])[0].slice(0, 90));
    ok('22. 常态图标色 #8E8E93 / 文字 #55595E（层级不变）',
      cs('#s15 .suc-print-row svg', 'color') === 'rgb(142, 142, 147)' && cs('#s15 .suc-print-row', 'color') === 'rgb(85, 89, 94)',
      cs('#s15 .suc-print-row svg', 'color') + ' / ' + cs('#s15 .suc-print-row', 'color'));
    ok('23. 图标设了 flex:none（不再被压扁）', cs('#s15 .suc-print-row svg', 'flexGrow') === '0' && cs('#s15 .suc-print-row svg', 'flexShrink') === '0',
      'grow=' + cs('#s15 .suc-print-row svg', 'flexGrow') + ' shrink=' + cs('#s15 .suc-print-row svg', 'flexShrink'));
  });

  /* ============ D. 几何回归：卡底上移 2px、卡内不溢出、无旧图标 ============ */
  S(function () {
    P('— D. 几何回归 —');
    var card = RK('#s15 .suc-card'), body = RK('#s15 .suc-body'), acts = RK('#s15 .suc-acts');
    ok('24. 卡高比 R17（46 行）少 2px：286.3 → 284.3', Math.abs(card.h - 284.3) <= 2.5, '卡高=' + card.h);
    ok('25. 卡底随之上移 2px：436 → 434', Math.abs(card.b - 434) <= 3, '卡底=' + card.b);
    ok('26. 内容区 top 仍 138（无需再动）', cs('#s15 .suc-body', 'top') === '138px' && Math.abs(body.t - 138) < 2.5,
      cs('#s15 .suc-body', 'top') + ' / 实测 ' + body.t);
    ok('27. 卡外操作带仍 4 项 / 62 高 / 距卡底 14', qa('#s15 .suc-act').length === 4 && Math.abs(acts.h - 62) < 1.5 && Math.abs(acts.t - card.b - 14) < 2,
      qa('#s15 .suc-act').length + ' 项 / ' + acts.h + ' / 间距 ' + (acts.t - card.b).toFixed(1));
    ok('28. 卡内无滚动（改短 2px 后更宽松）',
      q('#s15 .suc-body').scrollHeight <= q('#s15 .suc-body').clientHeight + 1,
      'scrollH=' + q('#s15 .suc-body').scrollHeight + ' clientH=' + q('#s15 .suc-body').clientHeight);
    ok('29. 旧入口已删净：无 .suc-print / 无 200 画布 svg',
      !q('#s15 .suc-print') && !/viewBox="0 0 200 200"/.test(q('#s15').innerHTML),
      q('#s15 .suc-print') ? '仍有 .suc-print' : '清爽');
    ok('30. 底栏 3 按钮 / 操作组 4 项文案不变',
      qa('#s15 .suc-bar button').length === 3 &&
      qa('#s15 .suc-act').map(function (e) { return e.textContent.trim(); }).join('/') === '改日期/改单号/看流水/客户详情',
      qa('#s15 .suc-act').map(function (e) { return e.textContent.trim(); }).join('/'));
  });

  /* ============ E. 交互不变 ============ */
  S(function () { q('#s15 .suc-print-row').click(); });
  S(function () {
    P('— E. 交互 —');
    ok('31. 点整行 → toast「已发送打印小票指令」', /已发送打印小票指令/.test(txt('#toast')), txt('#toast'));
    ok('32. 停留在 s15（不跳页）', active() === 's15', '当前页=' + active());
  });

  /* ============ F. 页面级回归：其他页面的 17px 图标未被波及 ============ */
  S(function () { w.go('s15'); });
  S(function () {
    P('— F. 波及面检查 —');
    var others = qa('#s15 .suc-act svg');
    ok('33. 卡外操作组图标仍 17px（本次只改打印小票）',
      others.length === 4 && Math.abs(R(others[0]).w - 17) < 0.6, others.length + ' 个 / 首个 ' + (others[0] ? R(others[0]).w : '-'));
    ok('34. 全局搜索样式表：没有别处误带 .suc-print-row 选择器',
      qa('#s15 .suc-print-row').length === 1, '命中 ' + qa('#s15 .suc-print-row').length + ' 个');
  });
});
</script>
</body></html>
