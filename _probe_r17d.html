<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
var log = [];
function P() { log.push([].slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return [].slice.call(d.querySelectorAll(s)); }
function raw(e) { if (typeof e === 'string') e = q(e); if (!e) return null; var r = e.getBoundingClientRect();
  return { l: Math.round(r.left * 10) / 10, r: Math.round(r.right * 10) / 10, t: Math.round(r.top * 10) / 10, b: Math.round(r.bottom * 10) / 10, w: Math.round(r.width * 10) / 10, h: Math.round(r.height * 10) / 10 }; }
function cs(e, p) { if (typeof e === 'string') e = q(e); return e ? getComputedStyle(e)[p] : 'none'; }
var steps = [];
function S(fn) { steps.push(fn); }
function next() { if (!steps.length) return finish(); var fn = steps.shift(); try { fn(); } catch (e) { P('ERR ' + e.message); } setTimeout(next, 260); }
function finish() { var pre = document.createElement('pre'); pre.textContent = log.join('\n'); document.body.appendChild(pre); }
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 500); }, 500);
  S(function () { w.go('s1'); });
  S(function () { q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); });
  S(function () { w.go('s6'); });
  S(function () { q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    P('#s15        ' + JSON.stringify(raw('#s15')));
    P('suc-head    ' + JSON.stringify(raw('#s15 .suc-head')) + '  css top=' + cs('#s15 .suc-head', 'top'));
    P('suc-body    ' + JSON.stringify(raw('#s15 .suc-body')) + '  css top=' + cs('#s15 .suc-body', 'top') +
      ' scrollTop=' + q('#s15 .suc-body').scrollTop + ' scrollH=' + q('#s15 .suc-body').scrollHeight + ' clientH=' + q('#s15 .suc-body').clientHeight +
      ' clientW=' + q('#s15 .suc-body').clientWidth);
    P('suc-card    ' + JSON.stringify(raw('#s15 .suc-card')) + '  margin=' + cs('#s15 .suc-card', 'marginTop') + '/' + cs('#s15 .suc-card', 'marginBottom') +
      ' border=' + cs('#s15 .suc-card', 'borderTopWidth'));
    P('suc-amt     ' + JSON.stringify(raw('#s15 .suc-amt')));
    P('suc-hr      ' + JSON.stringify(raw('#s15 .suc-hr')) + ' bw=' + cs('#s15 .suc-hr', 'borderTopWidth'));
    P('suc-rows    ' + JSON.stringify(raw('#s15 .suc-rows')));
    P('suc-row[0]  ' + JSON.stringify(raw('#s15 .suc-row')) + ' h_css=' + cs('#s15 .suc-row', 'minHeight'));
    P('print-row   ' + JSON.stringify(raw('#s15 .suc-print-row')) + ' css h=' + cs('#s15 .suc-print-row', 'height') +
      ' bt=' + cs('#s15 .suc-print-row', 'borderTopWidth') + ' mb=' + cs('#s15 .suc-print-row', 'marginBottom'));
    P('suc-acts    ' + JSON.stringify(raw('#s15 .suc-acts')));
    P('suc-bar     ' + JSON.stringify(raw('#s15 .suc-bar')));
    /* 偏移标定：.suc-head 的 CSS top 是 98 */
    var off = raw('#s15 .suc-head').t - 98 * 1.25;
    P('y 偏移(原始) = ' + Math.round(off * 10) / 10 + ' → 逻辑偏移 ' + Math.round(off / 1.25 * 10) / 10);
    var offx = raw('#s15 .suc-card').l - (16 * 1.25) - ((390 - 358) / 2 * 1.25);
    P('x 参考: 卡片 l=' + raw('#s15 .suc-card').l + '  body l=' + raw('#s15 .suc-body').l + '  #s15 l=' + raw('#s15').l);
    P('卡片宽 ' + raw('#s15 .suc-card').w + ' → 逻辑 ' + Math.round(raw('#s15 .suc-card').w / 1.25 * 10) / 10 +
      '（suc-body 宽 ' + raw('#s15 .suc-body').w + ' → ' + Math.round(raw('#s15 .suc-body').w / 1.25 * 10) / 10 + '）');
  });
});
</script>
</body></html>
