<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
/* v3 验收（二版：高度用「关掉过渡后的 offsetHeight」量，避免无头虚拟时间下过渡未跑完） */
var log = [];
function P() { log.push(Array.prototype.slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return Array.prototype.slice.call(d.querySelectorAll(s)); }
function txt(s) { var e = q(s); return e ? e.textContent.replace(/\s+/g, '') : 'N/A'; }
function cs(s, p) { var e = q(s); return e ? getComputedStyle(e)[p] : 'N/A'; }
function has(s, c) { var e = q(s); return e ? e.classList.contains(c) : 'N/A'; }
function vis() {
  return Array.prototype.slice.call(d.querySelectorAll('.screen'))
    .filter(function (s) { return getComputedStyle(s).display !== 'none'; })
    .map(function (s) { return s.id; }).join(',');
}
function names() { return w.cartItems.map(function (i) { return i.name + 'x' + i.qty; }).join('|'); }
function badge() {
  var e = d.querySelector('#s1 [data-cart-badge]');
  return e ? e.textContent + '/' + (e.classList.contains('show') ? 'show' : 'hide') : 'N/A';
}
function holdN() { return (q('#s4 [data-hold-count]') || {}).textContent + '/卡片' + qa('#holdList .hold-card').length; }
/* 关掉高度过渡后量真实几何：展开高 / 价目卡相对内容区顶部的偏移 */
function geo(tag, id) {
  var body = d.getElementById(id + 'BillBody');
  if (!body) { P(tag, 'NO BODY'); return; }
  var wrap = body.querySelector('[data-ccard-wrap]');
  var card = body.querySelector('.v2-ccard');
  var price = body.querySelector('.v2-price-card');
  var prev = wrap.style.transition;
  wrap.style.transition = 'none';
  void wrap.offsetWidth;
  var wh = wrap.offsetHeight;
  wrap.style.transition = prev;
  P(tag, 'cust-open=' + body.classList.contains('cust-open'),
    '顾客卡高=' + wh,
    '价目卡距内容区顶=' + Math.round(price.getBoundingClientRect().top - body.getBoundingClientRect().top) + 'px');
}

var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) return finish();
  var fn = steps.shift();
  try { fn(); } catch (e) { log.push('ERR ' + e.message); }
  setTimeout(next, 260);
}
function finish() {
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}

f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 400); }, 400);

  /* ===== A. 开单页（散客）默认收起 ===== */
  S(function () { w.resetGuestDefault && w.resetGuestDefault(); w.setCust('guest'); w.go('s1'); });
  S(function () {
    P('A 页面', vis());
    geo('A 散客默认', 's1');
    P('A 标题栏右侧', txt('#s1 .nav-cust'), '图标display=' + cs('#s1 .nav-cust .ic-mem', 'display'));
    P('A 标题栏日期入口数', qa('#s1 [data-date-ctl]').length + '/' + qa('#s5 [data-date-ctl]').length);
  });
  S(function () { q('#s1 .nav-cust').click(); });
  S(function () {
    geo('B 点击展开', 's1');
    P('B 动效 transition', cs('#s1 .v2-ccard-wrap', 'transition'));
  });
  S(function () { q('#s1 .nav-cust').click(); });
  S(function () { geo('C 再点收起', 's1'); });

  /* ===== D. 会员：标题栏图标 + 姓名 ===== */
  S(function () {
    w.__v2Member = { name: '陈女士', gender: 'female', avatar: 'assets/avatar_card_female.png',
      lastVisit: '2026-09-01', cards: '10', balance: '2049', discount: '8', isNew: false };
    w.__v2MemberNoBenefit = false;
    w.setCust('member');
    w.go('s5');
  });
  S(function () {
    P('D 页面', vis());
    P('D 会员标题栏', txt('#s5 .nav-cust'), '图标display=' + cs('#s5 .nav-cust .ic-mem', 'display'),
      '图标宽=' + (function () { var e = q('#s5 .nav-cust .ic-mem'); return e ? Math.round(e.getBoundingClientRect().width) : '-'; })());
    geo('D 会员默认收起', 's5');
  });
  S(function () { q('#s5 .nav-cust').click(); });
  S(function () {
    geo('E 会员点击展开', 's5');
    P('E 卡内会员名', (function () { var e = q('#s5 [data-ccard-wrap] .v2-ccard__name-text'); return e ? e.textContent : 'N/A'; })());
  });

  /* ===== F. 商品圆钮 → 底部 sheet ===== */
  S(function () { w.setCust('guest'); w.go('s1'); });
  S(function () {
    P('F 行内展开区数（应为0）', qa('#s1 .v2-row-expand').length);
    var b = q('#s1 .v2-cat-item .v2-add-btn');
    P('F 圆钮', !!b, b ? b.className : '-');
    b.click();
  });
  S(function () {
    P('F sheet', cs('#addSheetMask', 'display'), (q('#addSheetMask') || {}).className);
    P('F sheet 标题/数量(价格行已删除=' + !q('#asPrice') + ')', txt('#asTitle'), txt('#asQty'));
    q('#addSheetMask .addsheet__foot .btn-confirm').click();
  });
  S(function () {
    P('G sheet 关闭', cs('#addSheetMask', 'display'));
    P('G 明细', w.cartItems.length, names(), '角标=' + badge());
    P('G 下一步按钮', q('[data-next="s1"]').className);
  });

  /* ===== H. 挂单 → s14 ===== */
  S(function () { q('#s1 [data-guadan="s1"]').click(); });
  S(function () {
    P('H 页面', vis(), 'toast=' + txt('#toast'));
    P('H 挂单卡片', qa('#holdList .hold-card').length, '首卡=' + txt('#holdList .hold-card .hd .nm') + '|' +
      txt('#holdList .hold-card .items') + '|' + txt('#holdList .hold-card .ft .amt'));
    P('H 角标', badge(), '明细=' + w.cartItems.length);
    P('H 入口计数', holdN(), txt('#s0 .v2-home-hold'), txt('#s4 .nav-hold'));
  });
  /* 飞购物车延迟 toast 不应覆盖「挂单成功」，且不应把明细加回 */
  S(function () {
    P('H2 +600ms toast', txt('#toast'), '明细=' + w.cartItems.length, '角标=' + badge(), '页面=' + vis());
  });

  /* ===== I. 取挂单 → s6 ===== */
  S(function () { qa('#holdList .btn-take')[0].click(); });
  S(function () {
    P('I 页面', vis(), 'toast=' + txt('#toast'));
    P('I 明细', w.cartItems.length, names());
    P('I 剩余挂单', holdN(), '底栏=' + txt('#coPay'));
    P('I 顾客身份', w.coCust, '权益=' + qa('#s6 .co-item [data-benefit] .val').map(function (e) { return e.textContent.replace(/\s+/g, ''); }).join(','));
  });

  /* ===== J. s6 结账 → s15 ===== */
  S(function () { P('J 结账前', txt('#coPay')); q('#s6 .co-bar .btn-c').click(); });
  S(function () {
    P('J 页面', vis(), 'toast=' + txt('#toast'));
    P('J 金额/支付方式/金额', txt('#sucAmt'), txt('#sucPayName'), txt('#sucPayAmt'));
    P('J 剩余行', cs('#sucRestRow', 'display') + ' ' + txt('#sucRest'));
    P('J 日期/单号', txt('#sucDate'), txt('#sucNo'), '位数=' + (txt('#sucNo') || '').length);
    P('J 明细清空', w.cartItems.length, '角标=' + badge());
    P('J 内容区按钮', qa('#s15 .suc-act').map(function (b) { return b.textContent; }).join('/'));
    P('J 底部bar', qa('#s15 .suc-bar button').map(function (b) { return b.textContent.trim() || b.getAttribute('aria-label'); }).join('/'));
  });

  /* ===== K. 改日期 ===== */
  S(function () { q('#s15 [data-suc-act="date"]').click(); });
  S(function () {
    P('K 日期浮层', has('[data-date-pop]', 'show'));
    var days = qa('[data-date-pop] [data-date]').filter(function (x) {
      return !x.classList.contains('is-disabled') && !x.classList.contains('is-off');
    });
    var pick = days.filter(function (x) { return !x.classList.contains('is-sel'); })[0] || days[0];
    P('K 选中天', pick.textContent.trim());
    pick.click();
  });
  S(function () { P('K 浮层关', has('[data-date-pop]', 'show'), '成功页日期=' + txt('#sucDate')); });

  /* ===== L. 改单号 ===== */
  S(function () { q('#s15 [data-suc-act="no"]').click(); });
  S(function () {
    P('L sheet', cs('#sucNoMask', 'display'), '默认值=' + (q('#sucNoInput') || {}).value);
    q('#sucNoInput').value = 'abc2026100100';
    q('#sucNoOk').click();
  });
  S(function () { P('L 关闭=' + cs('#sucNoMask', 'display'), '单号=' + txt('#sucNo'), 'toast=' + txt('#toast')); });

  /* ===== M. 看流水 ===== */
  S(function () { q('#s15 [data-suc-act="flow"]').click(); });
  S(function () { P('M 看流水 →', vis()); w.go('s15'); });

  /* ===== N. 继续开单 ===== */
  S(function () { q('#s15 [data-suc-continue]').click(); });
  S(function () {
    P('N 页面', vis(), '明细=' + w.cartItems.length, '角标=' + badge());
    P('N 下一步', q('[data-next="s1"]') ? q('[data-next="s1"]').className : '-');
    P('N toast', txt('#toast'));
  });

  /* ===== O. 全局文案 ===== */
  S(function () {
    var t = d.body.innerText;
    P('O 快捷开单/快速消费', /快捷开单/.test(t) + '/' + /快速消费/.test(t),
      '直接收款次数=' + (t.match(/直接收款/g) || []).length);
    P('O 左侧导航14/15', qa('.nav-item[data-target="s14"], .nav-item[data-target="s15"]').length);
  });

  /* ===== P. s7 直接收款 结账 → s15 ===== */
  S(function () { w.setCust('guest'); w.setQcoCust('guest'); w.go('s1'); });
  S(function () { w.goQuickCheckout(); });
  S(function () {
    P('P s7 页', vis(), '底栏=' + txt('#qcoPay'));
    q('#s7 .co-bar .btn-c').click();
  });
  S(function () {
    P('P 页面', vis(), '金额=' + txt('#sucAmt'), '支付=' + txt('#sucPayName'),
      '剩余行=' + cs('#sucRestRow', 'display'), 'qcoItem=' + w.qcoItem, '角标=' + badge());
  });
});
</script>
</body></html>
