<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
var log = [];
function P() { log.push(Array.prototype.slice.call(arguments).join(' ')); }
var f = document.createElement('iframe');
f.src = 'index.html?bust=' + Date.now();
f.style.width = '390px'; f.style.height = '844px'; f.style.border = 'none';
document.body.appendChild(f);
var w, d;
function q(s) { return d.querySelector(s); }
function qa(s) { return Array.prototype.slice.call(d.querySelectorAll(s)); }
var steps = [];
function S(fn) { steps.push(fn); }
function next() {
  if (!steps.length) return finish();
  var fn = steps.shift();
  try { fn(); } catch (e) { log.push('ERR ' + e.message); }
  setTimeout(next, 240);
}
function finish() {
  var pre = document.createElement('pre');
  pre.textContent = log.join('\n');
  document.body.appendChild(pre);
}
f.addEventListener('load', function () {
  w = f.contentWindow; d = f.contentDocument;
  setTimeout(function () { setTimeout(next, 400); }, 400);

  S(function () {
    P('phone rect', JSON.stringify(q('#s14') ? q('#s14').getBoundingClientRect() : null));
    P('body zoom/transform', getComputedStyle(d.body).zoom, getComputedStyle(d.documentElement).fontSize);
    var pc = q('.phone');
    P('phone el', pc ? JSON.stringify(pc.getBoundingClientRect()) : 'none');
  });
  S(function () { w.setCust('guest'); w.go('s1'); });
  S(function () { P('s1 rect', JSON.stringify(q('#s1').getBoundingClientRect())); q('#s1 .v2-cat-item .v2-add-btn').click(); });
  S(function () {
    var g = q('#asGrid');
    P('asGrid html', g ? g.outerHTML.slice(0, 1200).replace(/></g, '>\n<') : 'none');
    P('qty cell display', (function () { var e = q('#asQtyCell'); return e ? getComputedStyle(e).display : 'none'; })());
    P('price lbl', q('#asPriceCell .lbl') ? q('#asPriceCell .lbl').textContent.trim() : 'none');
    P('staff grid html', q('#asStaffGrid') ? q('#asStaffGrid').innerHTML.slice(0, 3000).replace(/></g, '>\n<') : 'none');
  });
  S(function () { q('#addSheetMask .addsheet__foot .btn-confirm').click(); w.go('s4'); });
  S(function () {
    var row = q('#s4 .pick-row-wrap');
    P('pick-wrap html', row ? row.outerHTML.slice(0, 900) : 'none');
    P('pick-list width', q('#s4 .pick-list') ? JSON.stringify(q('#s4 .pick-list').getBoundingClientRect()) : 'none');
    P('pick-row css height', (function () { var e = q('#s4 .pick-row-wrap .pick-row'); if (!e) return 'none';
      var c = getComputedStyle(e); return c.height + '/' + c.minHeight + '/' + c.padding + '/' + c.boxSizing; })());
    P('pick-row rect', JSON.stringify(q('#s4 .pick-row-wrap .pick-row').getBoundingClientRect()));
    P('actions rect', JSON.stringify(q('#s4 .pick-row-wrap .pick-row-actions').getBoundingClientRect()));
    P('wrap rect', JSON.stringify(row.getBoundingClientRect()));
  });
  S(function () { var im = q('#holdList .hold-card .vip-img'); w.openHoldList(); });
  S(function () {
    var im = q('#holdList .hold-card .vip-img');
    P('vip-img rect', im ? JSON.stringify(im.getBoundingClientRect()) : 'none',
      'computed', im ? getComputedStyle(im).width + '/' + getComputedStyle(im).height : '-');
    var nm = q('#holdList .hold-card .nm');
    P('card nm font', nm ? getComputedStyle(nm).fontSize : '-', 'rect', nm ? JSON.stringify(nm.getBoundingClientRect()) : '-');
  });
});
</script>
</body></html>
